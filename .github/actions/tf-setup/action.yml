name: terraform setup
description: >-
  Assume an AWS role through OIDC, fetch the R2 state credentials and the
  Cloudflare token for this stage from SSM, and run terraform init.

inputs:
  environment:
    description: dev, staging or prod
    required: true
  role-to-assume:
    description: IAM role ARN
    required: true
  aws-region:
    description: AWS region
    required: true
  cloudflare-account-id:
    description: Cloudflare account id (non-secret)
    required: true
  stage:
    description: read or write — selects the SSM sub-path holding the credentials
    required: true

runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version_file: .terraform-version

    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}

    - name: fetch credentials from SSM
      shell: bash
      env:
        SSM_PREFIX: /gogo/ci/${{ inputs.environment }}/terraform/${{ inputs.stage }}
      run: |
        set -euo pipefail

        # R2 credentials go into a named profile, never into AWS_ACCESS_KEY_ID:
        # the AWS provider reads those variables too and would call AWS with
        # Cloudflare credentials.
        source scripts/lib/r2-profile.sh
        write_r2_profile "$SSM_PREFIX"

        token="$(aws ssm get-parameter --name "${SSM_PREFIX}/cloudflare-token" \
          --with-decryption --query 'Parameter.Value' --output text)"
        echo "::add-mask::${token}"
        echo "CLOUDFLARE_API_TOKEN=${token}" >> "$GITHUB_ENV"

    - name: terraform init
      shell: bash
      working-directory: terraform/environments/${{ inputs.environment }}
      env:
        CF_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
      run: |
        terraform init -input=false \
          -backend-config="endpoints={s3=\"https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com\"}"

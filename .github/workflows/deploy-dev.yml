name: deploy-dev

# Deploys GoGo-BE to the dev VPS.
#
# The VPS currently serves dev only; production will get its own, larger host
# later. So this is the deploy that actually runs today, and
# deploy-production.yml is the shape it will take when that host exists.
#
# Dispatch-only on purpose: a dev API that redeploys on every push to develop
# would be unusable for the Mobile and CMS developers pointing at it, because it
# would restart under them several times an hour.

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: GoGo-BE ref to deploy
        required: true
        default: develop

permissions:
  contents: read
  id-token: write

concurrency:
  group: gogo-deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy backend to the dev VPS
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_DEV_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: verify secrets match the manifest
        run: ./scripts/secrets/validate.sh dev

      - name: render env file
        run: ./scripts/deploy/render-env.sh dev "${RUNNER_TEMP}/gogo.env"

      - name: fetch deploy key
        run: |
          set -euo pipefail
          install -m 600 /dev/null "${RUNNER_TEMP}/deploy_key"
          aws ssm get-parameter --name /gogo/ci/dev/deploy/ssh-private-key \
            --with-decryption --query 'Parameter.Value' --output text \
            > "${RUNNER_TEMP}/deploy_key"

      # INF-068 / ADR-0007 Consequence 1. DEV is at 192.168.68.68 on a LAN and
      # this runner has no route to it, so the connection goes through the
      # tunnel the host already dials out on. cloudflared speaks the Access
      # protocol and hands ssh a stdio pipe; nothing is listening publicly and
      # there is no A record.
      - name: install cloudflared
        env:
          # Verified, not trusted. Pinning a version without checking the bytes
          # means the deploy runs whatever arrives at that URL — and this
          # binary sits directly in the path to a production-like host.
          CLOUDFLARED_VERSION: '2026.8.3'
          CLOUDFLARED_SHA256: f29324fe934d1e100617484c78deef803c4dc2cd351d645bbde42e96b4fccc5e
        run: |
          set -euo pipefail
          url="https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          # Retries, not a single attempt: the release endpoint has returned
          # 504 to a burst before, and the habit of re-running until green is
          # how a real failure gets waved through.
          curl -sSfL --connect-timeout 10 --retry 8 --retry-delay 10 \
            --retry-max-time 120 --retry-all-errors -o /tmp/cloudflared "$url"
          echo "${CLOUDFLARED_SHA256}  /tmp/cloudflared" | sha256sum -c -
          sudo install -m 755 /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          COMPOSE_EDGE: docker/docker-compose.edge-tunnel.yml
          REMOTE_ENV_FILE: .env.dev
          KNOWN_HOSTS_FILE: config/known_hosts.dev
          SSH_KEY_FILE: ${{ runner.temp }}/deploy_key
        run: |
          set -euo pipefail
          # Access service token, in the environment variables cloudflared
          # actually reads: `cloudflared access ssh --help` lists
          # [$TUNNEL_SERVICE_TOKEN_ID] and [$TUNNEL_SERVICE_TOKEN_SECRET]. The
          # first version exported CF_ACCESS_CLIENT_ID/SECRET — the names of the
          # HTTP *headers* the token travels in, which cloudflared never looks
          # at as env vars. It then sent no token at all, Access refused at the
          # edge, and the deploy died on `websocket: bad handshake` with nothing
          # in the tunnel's logs to explain why (run 33938635470).
          #
          # Environment rather than flags, so neither value reaches a command
          # line — a secret in argv is a secret in every `ps` on the runner.
          TUNNEL_SERVICE_TOKEN_ID="$(aws ssm get-parameter \
            --name /gogo/ci/dev/deploy/access-client-id \
            --query 'Parameter.Value' --output text)"
          TUNNEL_SERVICE_TOKEN_SECRET="$(aws ssm get-parameter \
            --name /gogo/ci/dev/deploy/access-client-secret \
            --with-decryption --query 'Parameter.Value' --output text)"
          export TUNNEL_SERVICE_TOKEN_ID TUNNEL_SERVICE_TOKEN_SECRET
          # Masked as well as exported: a non-zero exit inside cloudflared can
          # put the value in a log line nobody wrote.
          echo "::add-mask::${TUNNEL_SERVICE_TOKEN_SECRET}"

          # Set once, here, and consumed by scripts/lib/remote.sh, which is the
          # single place that assembles the flags for both ssh and scp. Host
          # key verification is unchanged: Access authenticates the connection,
          # the pinned known_hosts authenticates the host, and neither replaces
          # the other.
          export DEPLOY_PROXY_COMMAND="cloudflared access ssh --hostname %h"

          # INF-054, retargeted by ADR-0007 §E1 — the collector joins the
          # stack only when it has somewhere to write. Read from the env this
          # deploy just rendered, not from a workflow variable, so the two
          # cannot disagree: the container and the endpoint arrive together or
          # neither does.
          #
          # The variable is the self-hosted endpoint, not GRAFANA_PROM_URL.
          # Through the rollback window both may be present in SSM, and gating
          # on the old one would attach a collector configured for a store it
          # is no longer pointed at.
          if grep -qE '^PROMETHEUS_REMOTE_WRITE_URL=.+' "${RUNNER_TEMP}/gogo.env"; then
            export COMPOSE_OBSERVABILITY=docker/docker-compose.observability.yml
            echo "==> metrics collector enabled"
          else
            echo "==> no PROMETHEUS_REMOTE_WRITE_URL in SSM — deploying without the collector"
          fi
          ./scripts/deploy/deploy-vps.sh "${{ inputs.release_ref }}" "${RUNNER_TEMP}/gogo.env"

      - name: health check
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL_DEV }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            if curl -fsS --max-time 10 "$HEALTH_URL" >/dev/null; then
              echo "healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 6
          done
          echo "health check failed" >&2
          exit 1

      # INF-052 — the deploy's own gate ("verify secrets match the manifest")
      # compares SSM against a list of names. It cannot see a key Google
      # refuses, which is how DEV served a fake-equivalent Places provider
      # while every step above stayed green. This calls the real APIs with the
      # keys this deploy just rendered.
      #
      # Not blocking: a Google-side outage must not stop a dev deploy, and the
      # application degrades rather than failing to boot. It is here to be
      # *read* — the failure was never that nobody could fix it, it was that
      # nobody knew.
      - name: provider credential smoke test
        continue-on-error: true
        run: ./scripts/ops/check-provider-keys.sh dev

      # No automatic rollback here. On dev, a broken deploy is information —
      # rolling it back silently would hide the thing the developer is trying to
      # see, and there is no traffic to protect.
      - name: rollback hint
        if: failure()
        run: |
          echo "Deploy failed. To go back:" >&2
          echo "  ./scripts/deploy/rollback.sh" >&2

      - name: shred temporary credentials
        if: always()
        run: shred -u "${RUNNER_TEMP}/gogo.env" "${RUNNER_TEMP}/deploy_key" 2>/dev/null || true

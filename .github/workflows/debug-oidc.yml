name: debug-oidc

# Temporary. Prints the subject GitHub actually puts in the OIDC token, because
# every inference about it has been wrong so far: the IAM trust policy, the
# provider and the role ARN all check out, and the assume still fails.
#
# Only selected claims are printed. The token itself is a credential and is
# never echoed.

on:
  # Push-triggered, not dispatch: workflow_dispatch only works for a workflow
  # that already exists on the default branch, and master is 55 commits behind.
  push:
    branches: [develop]
    paths: ['.github/workflows/debug-oidc.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  with-environment:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: claims for a job that declares environment dev
        run: |
          set -euo pipefail
          token="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)"
          payload="$(printf '%s' "$token" | cut -d. -f2)"
          # base64url → base64, then pad
          payload="$(printf '%s' "$payload" | tr '_-' '/+')"
          case $(( ${#payload} % 4 )) in 2) payload="${payload}==";; 3) payload="${payload}=";; esac
          printf '%s' "$payload" | base64 -d 2>/dev/null \
            | jq '{sub, aud, repository, environment, ref, workflow_ref}'

  without-environment:
    runs-on: ubuntu-latest
    steps:
      - name: claims for a job with no environment
        run: |
          set -euo pipefail
          token="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)"
          payload="$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+')"
          case $(( ${#payload} % 4 )) in 2) payload="${payload}==";; 3) payload="${payload}=";; esac
          printf '%s' "$payload" | base64 -d 2>/dev/null | jq '{sub, aud, repository, ref}'

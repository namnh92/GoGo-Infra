name: terraform-plan-prod

# Pull requests are untrusted execution: the workflow file itself can be edited
# by the pull request. This job therefore assumes a role whose only credentials
# are read-only, and runs with -lock=false because acquiring a state lock needs
# write access to the lock object.
on:
  pull_request:
    branches: [master]
    paths:
      # What Terraform actually reads. `config/**` used to stand in for this and
      # was wrong in both directions: it fired an apply for
      # config/secrets.manifest.yml, which Terraform never opens, and it did not
      # fire for workers/share-link/src/index.js, which the share-link module
      # bakes into the Worker with file(). A trigger that runs on the wrong
      # changes and misses the right ones is worse than a broad one, because it
      # trains people to ignore it.
      #
      #   config/*.tfvars          the -var-file arguments
      #   config/well-known/**     read by file() in modules/cloudflare-worker
      #   workers/share-link/**    script_body, same module
      - 'terraform/**'
      - 'config/*.tfvars'
      - 'config/well-known/**'
      - 'workers/share-link/**'
      - '.github/workflows/terraform-*.yml'
      - '.github/actions/**'

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: terraform-plan-prod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: plan (prod)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/tf-setup
        with:
          environment: prod
          stage: read
          role-to-assume: ${{ vars.AWS_PLAN_PROD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: terraform plan
        working-directory: terraform/environments/prod
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock=false \
            -var-file=../../../config/global.tfvars \
            -var-file=../../../config/prod.tfvars | tee plan.txt

      - name: comment plan summary
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/environments/prod/plan.txt', 'utf8');
            // Counts only. The full plan stays in the job log.
            const summary = plan.split('\n').filter(l => /^(Plan:|No changes|Error)/.test(l)).join('\n');
            const body = [
              '### terraform plan — `prod`',
              '',
              'Advisory: run with `-lock=false`, so it can go stale if an apply lands first.',
              '',
              '```',
              summary || 'see job log',
              '```',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

name: deploy-production

# Application deployment, kept separate from terraform-apply-prod: infrastructure
# changes and application releases have different blast radius, different
# reviewers and different rollback paths.

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Commit sha of the GoGo-BE release to deploy
        required: true
      skip_migrations:
        description: Skip migrations (config-only redeploy)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: gogo-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy backend to production VPS
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      # Temporary credentials through OIDC. The VPS itself never holds an AWS key.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_PROD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: verify secrets match the manifest
        run: ./scripts/secrets/validate.sh prod

      - name: render env file
        run: ./scripts/deploy/render-env.sh prod "${RUNNER_TEMP}/gogo.env"

      - name: fetch deploy key
        run: |
          set -euo pipefail
          install -m 600 /dev/null "${RUNNER_TEMP}/deploy_key"
          aws ssm get-parameter --name /gogo/ci/prod/deploy/ssh-private-key \
            --with-decryption --query 'Parameter.Value' --output text \
            > "${RUNNER_TEMP}/deploy_key"

      # The host key is pinned in the repository, not discovered with
      # ssh-keyscan. Trust-on-first-use on every run means whoever can intercept
      # the runner's connection receives the production environment file.
      - name: deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          COMPOSE_EDGE: docker/docker-compose.edge-caddy.yml
          REMOTE_ENV_FILE: .env.prod
          KNOWN_HOSTS_FILE: config/known_hosts.prod
          SSH_KEY_FILE: ${{ runner.temp }}/deploy_key
          SKIP_MIGRATIONS: ${{ inputs.skip_migrations }}
        run: ./scripts/deploy/deploy-vps.sh "${{ inputs.release_sha }}" "${RUNNER_TEMP}/gogo.env"

      - name: health check
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            if curl -fsS --max-time 10 "$HEALTH_URL" | tee /dev/stderr | grep -q '"api":"healthy"'; then
              echo "healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 6
          done
          echo "health check failed" >&2
          exit 1

      # A push-provider outage must not trigger a rollback: the health endpoint
      # reports onesignal separately as degraded while api stays healthy.
      - name: rollback on failure
        if: failure()
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          COMPOSE_EDGE: docker/docker-compose.edge-caddy.yml
          REMOTE_ENV_FILE: .env.prod
          KNOWN_HOSTS_FILE: config/known_hosts.prod
          SSH_KEY_FILE: ${{ runner.temp }}/deploy_key
        run: ./scripts/deploy/rollback.sh

      - name: shred temporary credentials
        if: always()
        run: shred -u "${RUNNER_TEMP}/gogo.env" "${RUNNER_TEMP}/deploy_key" 2>/dev/null || true

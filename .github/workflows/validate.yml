name: validate

on:
  pull_request:
  push:
    branches: [master, develop]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: terraform fmt / validate / tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version_file: .terraform-version

      - name: terraform fmt
        run: terraform fmt -check -recursive .

      - name: terraform validate (modules and environments)
        run: |
          set -euo pipefail
          for dir in terraform/modules/*/ terraform/environments/*/ bootstrap/*/; do
            echo "::group::validate ${dir}"
            # -backend=false: validation must not need remote state credentials.
            terraform -chdir="${dir}" init -backend=false -input=false >/dev/null
            terraform -chdir="${dir}" validate
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: tflint
        env:
          # --recursive changes into each directory and looks for .tflint.hcl
          # beside the files it is linting, so the root config was being ignored
          # and its rule settings had no effect.
          TFLINT_CONFIG_FILE: ${{ github.workspace }}/.tflint.hcl
        run: |
          tflint --init
          tflint --recursive

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  scripts:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A comment starting with "# shellcheck" is parsed as a directive whatever
      # follows, so a sentence beginning with that word becomes SC1072 and turns
      # a warning-level run into a hard error. Caught here because the message
      # points at the comment, not at what it was explaining.
      - name: no prose masquerading as a shellcheck directive
        run: |
          if grep -rnE '^[[:space:]]*# shellcheck ' scripts/ \
             | grep -vE '# shellcheck (disable|source|shell|enable)='; then
            echo "Comment above starts with '# shellcheck' but is not a directive." >&2
            exit 1
          fi
          echo "ok"

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          # info-level notes (SC1091 on sourced files) must not fail CI
          shellcheck -x --severity=warning scripts/*/*.sh

      # The tfvars parser is regression-tested because its previous version
      # failed silently on BSD userlands and returned the whole line, which made
      # an empty required field look populated.
      - name: tfvars parser tests
        run: ./scripts/lib/config.test.sh

      - name: manifest parses
        run: |
          for env in dev staging prod; do
            python3 scripts/lib/manifest.py "$env" >/dev/null
            echo "${env}: $(python3 scripts/lib/manifest.py "$env" --required | wc -l) required parameters"
          done

      # pull_request_target runs the base branch's workflow with full privileges
      # against the pull request's code. With OIDC credentials in reach, that is
      # a direct path from an unreviewed change to production secrets.
      - name: no pull_request_target in privileged workflows
        run: |
          if grep -rn 'pull_request_target' .github/workflows/; then
            echo "pull_request_target is forbidden in this repository" >&2
            exit 1
          fi
          echo "ok: no pull_request_target"

      - name: no committed secret values in config
        run: |
          set -euo pipefail
          if grep -rnE '(secret|token|password|key)[[:space:]]*=[[:space:]]*"[^"]{12,}"' config/*.tfvars; then
            echo "config/*.tfvars must contain only non-secret values" >&2
            exit 1
          fi
          echo "ok: config holds no secret-looking values"

name: validate

on:
  pull_request:
  push:
    branches: [master, develop]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: terraform fmt / validate / tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version_file: .terraform-version

      - name: terraform fmt
        run: terraform fmt -check -recursive .

      - name: terraform validate (modules and environments)
        run: |
          set -euo pipefail
          for dir in terraform/modules/*/ terraform/environments/*/ bootstrap/*/; do
            echo "::group::validate ${dir}"
            # -backend=false: validation must not need remote state credentials.
            terraform -chdir="${dir}" init -backend=false -input=false >/dev/null
            terraform -chdir="${dir}" validate
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: tflint
        env:
          # --recursive changes into each directory and looks for .tflint.hcl
          # beside the files it is linting, so the root config was being ignored
          # and its rule settings had no effect.
          TFLINT_CONFIG_FILE: ${{ github.workspace }}/.tflint.hcl
        run: |
          tflint --init
          tflint --recursive

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Not gitleaks/gitleaks-action. On a pull_request event that action calls
      # GET /repos/{o}/{r}/pulls/{n}/commits, which this workflow's token cannot
      # do under `permissions: contents: read`; it crashed with 403 "Resource
      # not accessible by integration" on every PR while passing on pushes to
      # develop, so the scan looked healthy and covered nothing on the branch
      # where it matters.
      #
      # Widening the token to pull-requests: read would fix the symptom and buy
      # the API call, the rate limit and the deprecated runtime with it. The
      # binary needs no token at all, and runs the identical command to
      # `make scan`, so a clean local run means a clean CI run.
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: 8.18.4
          # Verified, not trusted. Pinning a version without checking the bytes
          # means CI runs whatever arrives at that URL.
          GITLEAKS_SHA256: ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"

          # The first run of this step died on `curl: (35) Recv failure:
          # Connection reset by peer` against a URL that was correct and
          # reachable — a transient reset on the release-asset redirect. Without
          # retries that is a red build on an unrelated PR, and the habit of
          # re-running until green is how a real failure gets waved through.
          # Six attempts over ~15s was not enough for a GitHub incident: the
          # release endpoint returned 504 to every one of them, and the same
          # outage was timing out API calls elsewhere at that minute. Two
          # minutes of retries rides out a blip without pretending it can ride
          # out an outage.
          curl -sSfL --connect-timeout 10 --retry 8 --retry-delay 10 \
            --retry-max-time 120 --retry-all-errors -o /tmp/gitleaks.tar.gz "$url"

          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Runs before the scan: an allowlist edit that quietly disables a rule
      # would otherwise show up as a clean scan.
      - name: gitleaks rules still catch real credentials
        run: ./scripts/ci/gitleaks-rules.test.sh

      - name: gitleaks
        run: make scan

  workers:
    name: share-link worker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The Worker is the hop that tells the API who is on the other end of a
      # click (INF-070). Its tests were sitting beside it, run by no job — and
      # a test nobody runs is a comment. Pass the file rather than the
      # directory: the directory form resolves as a module on Node 22 and dies
      # before a single test runs.
      - name: node --test
        run: node --test workers/share-link/test/worker.test.mjs

  scripts:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A comment starting with "# shellcheck" is parsed as a directive whatever
      # follows, so a sentence beginning with that word becomes SC1072 and turns
      # a warning-level run into a hard error. Caught here because the message
      # points at the comment, not at what it was explaining.
      - name: no prose masquerading as a shellcheck directive
        run: |
          if grep -rnE '^[[:space:]]*# shellcheck ' scripts/ \
             | grep -vE '# shellcheck (disable|source|shell|enable)='; then
            echo "Comment above starts with '# shellcheck' but is not a directive." >&2
            exit 1
          fi
          echo "ok"

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          # info-level notes (SC1091 on sourced files) must not fail CI
          shellcheck -x --severity=warning scripts/*/*.sh

      # The tfvars parser is regression-tested because its previous version
      # failed silently on BSD userlands and returned the whole line, which made
      # an empty required field look populated.
      # A path filter is a security control that looks like configuration:
      # terraform-apply-dev.yml runs a real apply on every matching push, so a
      # filter that is too broad applies drift nobody asked for (GoGo-Infra#172)
      # and one that is too narrow leaves a Terraform input unwatched.
      - name: terraform trigger paths
        run: ./scripts/ci/check-workflow-triggers.test.sh

      - name: tfvars parser tests
        run: ./scripts/lib/config.test.sh

      # INF-024 acceptance is "no automation depends on OAuth". That was prose
      # in docs/accounts.md until this step; prose does not survive the next
      # person in a hurry.
      - name: CI authenticates as a machine, not a person
        run: |
          ./scripts/ci/check-workflow-auth.test.sh
          ./scripts/ci/check-workflow-auth.sh

      # The quota check's exit code is the entire alert. A breach that returned
      # 0 would be a silent alarm, and nothing else would notice.
      - name: quota thresholds still fire
        run: ./scripts/ops/check-quotas.test.sh

      # A health check whose exit code is wrong is an alarm wired to nothing,
      # and the DEV observability host is a desktop: asleep, it looks exactly
      # like a system with nothing to report (ADR-0007 §E4).
      - name: the observability probe reports unknown, never zero
        run: ./scripts/ops/check-observability.test.sh

      # The stack's images ship BusyBox. A healthcheck written for GNU wget
      # printed usage text, sat at `unhealthy` for hours, and kept Grafana at
      # `Created` — because it waits on service_healthy. Caught in production
      # (DEV), guarded here.
      - name: observability compose runs on the images it ships
        run: ./scripts/ci/observability-compose.test.sh

      # The first alert rules this repository has ever carried (ADR-0009 /
      # INF-156). The failure they are guarded against is not a syntax error —
      # it is a rule that loads cleanly and means nothing: alerting on the level
      # of a baseline that is 1,033 rows by design, reading a lifetime counter
      # that fires on history, or shipping unpaused into an environment where
      # none of the 39 series exist yet.
      - name: administrative alert rules mean something
        run: ./scripts/ci/alerting-provisioning.test.sh

      # The Access SSH deploy path failed twice on things a grep would have
      # caught: the wrong env var names for the service token, and an ingress
      # that pointed at the tunnel container's own loopback.
      - name: the Access SSH deploy path is wired to what cloudflared reads
        run: ./scripts/ci/access-ssh.test.sh

      # The provider probe's whole value is the reason code it reports. Routes
      # errors arrive as a JSON array, and reading them as an object turned a
      # live BILLING_DISABLED into "no machine-readable reason" — a confident
      # wrong diagnosis pointing at the key instead of the project's billing.
      - name: provider probe still reports Google's reason
        run: ./scripts/ops/check-provider-keys.test.sh

      # An unset budget ceiling REFUSES in GoGo-BE — it does not mean unlimited
      # — and the two scope-wide ceilings refuse the whole scope on their own.
      # Without this, an environment holding four of the five values renders a
      # clean env file and authorises nothing, silently.
      - name: the place-refresh budget gate still tells refuse from configured
        run: ./scripts/lib/place-refresh-budget.test.sh

      # INF-051. The variable count is the only thing the person running a
      # render or a pull sees to decide whether it finished. Counting with a
      # character class that had no digit in it dropped every `R2_*` name and
      # read as "parameters did not come back" — a missing-credential hunt for
      # credentials that were in SSM and in the file. The test also fails if a
      # third copy of that grep appears.
      - name: the variable count includes names with digits
        run: ./scripts/lib/env-file.test.sh

      # The production seed guard lives in two places — here and in GoGo-BE's
      # seed — and is only two guards if the confirmation reaches both. It did
      # not: the compose invocation forwarded APP_ENV and nothing else, so a
      # confirmed prod seed cleared this script and was refused inside the
      # container.
      - name: the seed forwards its production confirmation
        run: ./scripts/deploy/seed-vps.test.sh

      # The namespace default decides what render-env.sh writes into the
      # production process environment. A client key drifting into that default
      # would hand the API a credential it cannot read and must not hold.
      - name: manifest parses, and namespaces stay separated
        run: |
          ./scripts/lib/manifest.test.sh
          for env in dev staging prod; do
            python3 scripts/lib/manifest.py "$env" >/dev/null
            echo "${env}: $(python3 scripts/lib/manifest.py "$env" --required | wc -l) required parameters"
          done

      # INF-070. The value this script moves must never reach Terraform, a file,
      # an environment variable or a log, and the only way to keep that true is
      # to assert it. The test also fails if a `secret_text` binding or a
      # value-carrying variable is ever added back.
      - name: the worker secret never leaves the pipe
        run: ./scripts/secrets/put-worker-secret.test.sh

      # NTF-BE-008. The identity signing key is the one credential here that is
      # neither a token nor a string: it is a PEM, and the runtime env renderers
      # emit one line per variable. The tests assert the encoding that survives
      # that, and that a wrong curve, a public key or an encrypted file is
      # refused before the upload rather than discovered on a phone.
      - name: the identity key is validated and encoded before it reaches SSM
        run: ./scripts/secrets/put-identity-key.test.sh

      # The mobile env renderer decides what a client build is allowed to hold.
      # Its tests are the only thing standing between "public config" and a
      # server key rendered into a bundle, so they run here rather than living
      # beside the script for whoever remembers to invoke them.
      - name: the mobile env renderer refuses server secrets and cross-env values
        run: python3 scripts/secrets/mobile-env.test.py

      # Tenjin's client keys are per environment and look alike. The failure
      # this guards is a DEV key rendered into a store build, which attributes
      # real installs to the wrong app and cannot be undone after the fact.
      - name: the Tenjin renderer never falls back across environments
        run: python3 scripts/secrets/tenjin-mobile-env.test.py

      # INF-071. A deploy that recreates the tunnel it is running over cannot
      # recover the host it just cut off, and this host has no inbound ports to
      # fall back on. The test pins which services the deploy may recreate.
      - name: the deploy cannot cut its own way in
        run: ./scripts/deploy/deploy-vps.test.sh

      # pull_request_target runs the base branch's workflow with full privileges
      # against the pull request's code. With OIDC credentials in reach, that is
      # a direct path from an unreviewed change to production secrets.
      - name: no pull_request_target in privileged workflows
        run: |
          # Match the YAML trigger key, not the word. Searching for the bare
          # string made this step fail on its own source — the check reported a
          # violation that was only its own description of the violation.
          if grep -rnE '^[[:space:]]*pull_request_target:' .github/workflows/; then
            echo "pull_request_target is forbidden in this repository" >&2
            exit 1
          fi
          echo "ok: no pull_request_target trigger"

      - name: no committed secret values in config
        run: |
          set -euo pipefail
          if grep -rnE '(secret|token|password|key)[[:space:]]*=[[:space:]]*"[^"]{12,}"' config/*.tfvars; then
            echo "config/*.tfvars must contain only non-secret values" >&2
            exit 1
          fi
          echo "ok: config holds no secret-looking values"

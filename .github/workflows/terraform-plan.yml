name: terraform-plan

on:
  pull_request:
    paths:
      - 'terraform/**'
      - 'bootstrap/**'
      - '.github/workflows/terraform-*.yml'

permissions:
  contents: read
  id-token: write        # required to request the OIDC token
  pull-requests: write   # to post the plan summary

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: plan (${{ matrix.environment }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version_file: .terraform-version

      # Read-only role. There is no apply in this workflow, by design:
      # a pull request must never be able to change production infrastructure.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRA_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform init
        working-directory: terraform/environments/${{ matrix.environment }}
        env:
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID_R2: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY_R2: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
        run: |
          terraform init -input=false \
            -backend-config="endpoints={s3=\"https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com\"}" \
            -backend-config="access_key=${AWS_ACCESS_KEY_ID_R2}" \
            -backend-config="secret_key=${AWS_SECRET_ACCESS_KEY_R2}"

      - name: terraform plan
        id: plan
        working-directory: terraform/environments/${{ matrix.environment }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock=false | tee plan.txt

      - name: comment plan summary
        uses: actions/github-script@v7
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        with:
          script: |
            const fs = require('fs');
            const dir = `terraform/environments/${process.env.ENVIRONMENT}`;
            let plan = fs.readFileSync(`${dir}/plan.txt`, 'utf8');
            // Terraform redacts sensitive values itself, but keep the comment
            // small so nothing unexpected ends up in a public-facing surface.
            const summary = plan.split('\n').filter(l => /^(Plan:|No changes|Error)/.test(l)).join('\n');
            const body = [
              `### terraform plan — \`${process.env.ENVIRONMENT}\``,
              '```',
              summary || 'see job log',
              '```',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

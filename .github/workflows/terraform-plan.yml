name: terraform-plan

on:
  pull_request:
    paths:
      - 'terraform/**'
      - 'bootstrap/**'
      - '.github/workflows/terraform-*.yml'

permissions:
  contents: read
  id-token: write        # required to request the OIDC token
  pull-requests: write   # to post the plan summary

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: plan (${{ matrix.environment }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version_file: .terraform-version

      # This job runs on pull_request, so treat everything it can read as
      # readable by anyone who can open a pull request. The plan role therefore
      # reads only /gogo/ci/terraform/plan/*, which holds read-only Cloudflare
      # and R2 credentials. The write-capable pair lives under .../apply/* and
      # this role has no permission on that path (INF-026, docs/adr/0001).
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRA_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: fetch backend credentials from SSM
        run: |
          source scripts/lib/r2-profile.sh
          write_r2_profile /gogo/ci/terraform/plan

      - name: fetch Cloudflare read-only token
        id: cf
        run: |
          set -euo pipefail
          token="$(aws ssm get-parameter \
            --name /gogo/ci/terraform/plan/cloudflare-api-token-ro \
            --with-decryption --query 'Parameter.Value' --output text)"
          # Mask before the value can reach any later log line.
          echo "::add-mask::${token}"
          echo "CLOUDFLARE_API_TOKEN=${token}" >> "$GITHUB_ENV"

      - name: terraform init
        working-directory: terraform/environments/${{ matrix.environment }}
        env:
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          terraform init -input=false \
            -backend-config="endpoints={s3=\"https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com\"}"

      - name: terraform plan
        working-directory: terraform/environments/${{ matrix.environment }}
        env:
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock=false | tee plan.txt

      - name: comment plan summary
        uses: actions/github-script@v7
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        with:
          script: |
            const fs = require('fs');
            const dir = `terraform/environments/${process.env.ENVIRONMENT}`;
            const plan = fs.readFileSync(`${dir}/plan.txt`, 'utf8');
            // Only the counts. The full plan stays in the job log, where the
            // repository's log-visibility settings apply.
            const summary = plan.split('\n').filter(l => /^(Plan:|No changes|Error)/.test(l)).join('\n');
            const body = [
              `### terraform plan — \`${process.env.ENVIRONMENT}\``,
              '```',
              summary || 'see job log',
              '```',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

name: terraform-apply-dev

on:
  push:
    branches: [develop]
    paths:
      # What Terraform actually reads. `config/**` used to stand in for this and
      # was wrong in both directions: it fired an apply for
      # config/secrets.manifest.yml, which Terraform never opens, and it did not
      # fire for workers/share-link/src/index.js, which the share-link module
      # bakes into the Worker with file(). A trigger that runs on the wrong
      # changes and misses the right ones is worse than a broad one, because it
      # trains people to ignore it.
      #
      #   config/*.tfvars          the -var-file arguments
      #   config/well-known/**     read by file() in modules/cloudflare-worker
      #   workers/share-link/**    script_body, same module
      - 'terraform/**'
      - 'config/*.tfvars'
      - 'config/well-known/**'
      - 'workers/share-link/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# cancel-in-progress stays false: cancelling an apply mid-flight leaves state
# and reality out of sync. This is a second control on top of the state lock,
# not a replacement for it.
concurrency:
  group: gogo-terraform-dev
  cancel-in-progress: false

jobs:
  apply:
    name: apply (dev)
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/tf-setup
        with:
          environment: dev
          stage: write
          role-to-assume: ${{ vars.AWS_APPLY_DEV_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: terraform apply
        working-directory: terraform/environments/dev
        run: |
          terraform apply -input=false -auto-approve \
            -var-file=../../../config/global.tfvars \
            -var-file=../../../config/dev.tfvars

      - name: done
        run: echo "dev apply finished"

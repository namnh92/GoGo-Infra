name: secrets-readiness

# GoGo-Infra#309 D-5 / ADR-0016 — nightly secrets readiness.
#
# Runs `validate.sh <env> --strict --report` and `validate.sh tools --strict
# --report` as the metadata-only role gogo-<env>-readiness: parameter names,
# types, dates and tags through DescribeParameters, never a value (the role
# holds no GetParameter* and is denied kms:Decrypt). The tools tree is never
# covered by an environment run, so it is checked here too — an empty or
# partial /gogo/tools/ fails this workflow (the 2026-10-29 incident class).
#
# The exit code is #308's strict verdict, unchanged: missing required,
# declared-absent, retired-present, parked-present, undeclared, wrong type or
# a tag finding fails the run ("lưu = khai báo"). A tree that could not be read
# is UNKNOWN, which fails it too. Planned capabilities are reported, never
# counted. GitHub notifies the owner when a scheduled run fails, like quotas.yml.
#
# Both reports, the run summary and both artifacts are published on every run,
# whatever either validation returned. The reports hold names and states only;
# the ci, tools and mobile inventory stays in GitHub (owner decision D-6).

on:
  schedule:
    # 01:00 UTC — 08:00 in Asia/Ho_Chi_Minh, beside quotas.yml. Schedules fire
    # from the default branch, which is `develop` (gh repo view, 2026-10-29).
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      env:
        description: Environment to check (stag and prod join when their environments exist — #307, #293)
        required: true
        default: dev
        type: choice
        options:
          - dev

permissions:
  contents: read
  id-token: write

concurrency:
  group: gogo-secrets-readiness
  cancel-in-progress: false

jobs:
  readiness:
    name: secrets readiness (${{ matrix.env }} + tools)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.env) || '["dev"]') }}

    # The readiness role trusts `environment:<env>` of GoGo-Infra only. The dev
    # environment admits `develop`, the branch schedules run from.
    environment: ${{ matrix.env }}

    steps:
      - uses: actions/checkout@v4

      # AWS_READINESS_ROLE_ARN is a variable of the GitHub Environment, so each
      # environment's job assumes its own role (terraform output
      # readiness_role_arn).
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_READINESS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: validate ${{ matrix.env }} --strict --report
        id: env_check
        env:
          ENV_NAME: ${{ matrix.env }}
        run: |
          set -uo pipefail
          rc=0
          ./scripts/secrets/validate.sh "$ENV_NAME" --strict \
            --report "${RUNNER_TEMP}/secrets-readiness-${ENV_NAME}.json" || rc=$?
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"

      # Once per run, not once per environment: /gogo/tools/ belongs to none.
      - name: validate tools --strict --report
        id: tools_check
        if: always() && matrix.env == 'dev'
        run: |
          set -uo pipefail
          rc=0
          ./scripts/secrets/validate.sh tools --strict \
            --report "${RUNNER_TEMP}/secrets-readiness-tools.json" || rc=$?
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"

      # D-3: one line per capability per environment, then the core group.
      # Displayed from the reports; nothing here computes a verdict.
      - name: run summary
        if: always()
        env:
          ENV_NAME: ${{ matrix.env }}
        run: |
          set -uo pipefail
          for name in "$ENV_NAME" tools; do
            [[ "$name" == tools && "$ENV_NAME" != dev ]] && continue
            report="${RUNNER_TEMP}/secrets-readiness-${name}.json"
            if [[ -s "$report" ]]; then
              python3 scripts/lib/manifest.py "$name" --summary "$report" >> "$GITHUB_STEP_SUMMARY"
            else
              printf '## Secrets readiness — %s\n\nNo report was written.\n' "$name" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo >> "$GITHUB_STEP_SUMMARY"
          done

      - name: upload the ${{ matrix.env }} report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secrets-readiness-${{ matrix.env }}
          path: ${{ runner.temp }}/secrets-readiness-${{ matrix.env }}.json
          retention-days: 90
          if-no-files-found: error

      - name: upload the tools report
        if: always() && matrix.env == 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: secrets-readiness-tools
          path: ${{ runner.temp }}/secrets-readiness-tools.json
          retention-days: 90
          if-no-files-found: error

      # The run's verdict, after everything above has been published: either
      # validation failing or UNKNOWN fails the run.
      - name: verdict
        if: always()
        env:
          ENV_RC: ${{ steps.env_check.outputs.rc }}
          TOOLS_RC: ${{ steps.tools_check.outputs.rc }}
          ENV_NAME: ${{ matrix.env }}
        run: |
          set -uo pipefail
          echo "${ENV_NAME}: exit ${ENV_RC:-none}; tools: exit ${TOOLS_RC:-not run}"
          [[ "${ENV_RC:-}" == 0 ]] || exit 1
          [[ "$ENV_NAME" != dev || "${TOOLS_RC:-}" == 0 ]] || exit 1

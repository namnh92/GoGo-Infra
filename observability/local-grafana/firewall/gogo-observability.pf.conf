# Host firewall for 192.168.68.168 — ADR-0007 §E4.
#
# Binding a container port to one address decides which interface answers. It
# does not decide who may ask. §E4 wants both, and §E8 refuses "the LAN is
# fine" as an answer: the LAN is a network boundary, not a trusted zone.
#
# What each port is for, stated because the difference is the rule:
#   9090  one writer — the BE host at 192.168.68.68. Not a LAN service.
#   3000  the admin workstations named below, and nothing else.
#
# Neither port is public, and neither goes behind the Cloudflare Tunnel.
#
# Load (macOS):
#   sudo cp gogo-observability.pf.conf /etc/pf.anchors/gogo.observability
#   printf 'anchor "gogo.observability"\nload anchor "gogo.observability" from "/etc/pf.anchors/gogo.observability"\n' \
#     | sudo tee -a /etc/pf.conf
#   sudo pfctl -f /etc/pf.conf && sudo pfctl -E
#
# Verify from off-LAN, which is the acceptance criterion — a rule that was
# never tested from the outside is a rule nobody has read back:
#   nc -vz -w 3 192.168.68.168 9090   # must fail
#   nc -vz -w 3 192.168.68.168 3000   # must fail

obs_if   = "en0"
obs_self = "192.168.68.168"
be_host  = "192.168.68.68"

# Admin workstations allowed at Grafana. Keep this list short and real; every
# address added here is one more place a dashboard credential can be typed.
table <obs_admins> persist { 192.168.68.68 }

# Default for these two ports is deny. Stated first so an incomplete edit below
# fails closed rather than open.
block drop in quick on $obs_if proto tcp from any to $obs_self port { 9090, 3000 }

pass in quick on $obs_if proto tcp from $be_host      to $obs_self port 9090 keep state
pass in quick on $obs_if proto tcp from <obs_admins>  to $obs_self port 3000 keep state

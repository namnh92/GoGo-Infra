      annotations:
        summary: "over 5% of executed backfill places failed in the last hour"
        impact: "a systematic problem rather than scattered bad rows"
        expected: "failure rate below 5%"
        description: "mode=execute only: a dry run's counters describe what would have happened and must never alert. clamp_min guards the divide when no places were processed."
        runbook: "docs/runbook-administrative-alerts.md#adm-backfill-failure-rate"

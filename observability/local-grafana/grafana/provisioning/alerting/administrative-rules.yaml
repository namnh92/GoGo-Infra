        impact: "the boundary release is refused; the previous one still serves"
        expected: "ERROR findings stay at 0"
        baseline: "geometry WARNING families are the baseline: 1,370 COMMUNE_OUTSIDE_PROVINCE, 233 SAME_LEVEL_OVERLAP, 56 AREA_OUTLIER"
        description: "Province and commune outlines were simplified independently, which is what produces the three WARNING families above. They are the data, not a defect, and this rule never reads them."
        runbook: "docs/runbook-administrative-alerts.md#adm-boundary-validation-error"
    - uid: adm-cache-refresh-failing
      title: "Administrative cache refresh failing"
      condition: B
      data:
        - refId: A
          relativeTimeRange:
            from: 3600
            to: 0
          datasourceUid: gogo-prometheus-local
          model:
            refId: A
            datasource:
              type: prometheus
              uid: gogo-prometheus-local
            editorMode: code
            expr: "sum(increase(administrative_cache_refresh_total{env=\"dev\",result=\"failed\"}[30m])) or vector(0)"
            instant: true
            range: false
            intervalMs: 60000
            maxDataPoints: 43200
        - refId: B
          relativeTimeRange:
            from: 3600
            to: 0
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            conditions:
              - evaluator:
                  type: gt
                  params:
                    - 2
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  type: last
                type: query
            intervalMs: 1000
            maxDataPoints: 43200
      for: 10m
      noDataState: OK
      execErrState: OK
      isPaused: ${GOGO_ADM_ALERTS_PAUSED}
      labels:
        service: administrative-data
        env: dev
        severity: warning
      annotations:
        summary: "more than 2 cache warm-up failures in 30m"
        impact: "the publishing process serves stale reads until the 60s TTL converges; PostgreSQL stays authoritative"
        expected: "occasional single failures are normal and do not fire"
        description: "Threshold is >2, not >0. A single failed warm-up is not an outage: other processes converge on the TTL and the database is authoritative. Repetition is the signal."
        runbook: "docs/runbook-administrative-alerts.md#adm-cache-refresh-failing"

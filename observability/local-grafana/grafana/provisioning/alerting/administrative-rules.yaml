          datasourceUid: gogo-prometheus-local
          model:
            refId: A
            datasource:
              type: prometheus
              uid: gogo-prometheus-local
            editorMode: code
            expr: "(sum(increase(administrative_backfill_places_total{env=\"dev\",outcome=\"failure\",mode=\"execute\"}[1h])) or vector(0)) / clamp_min(sum(increase(administrative_backfill_places_total{env=\"dev\",mode=\"execute\"}[1h])) or vector(0), 1)"
            instant: true
            range: false
            intervalMs: 60000
            maxDataPoints: 43200

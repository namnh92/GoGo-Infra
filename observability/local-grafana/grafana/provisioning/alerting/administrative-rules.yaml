      annotations:
        summary: "a backfill run ended in outcome=failed in the last hour"
        impact: "the run stopped part-way; its cursor and counters are on the run row"
        expected: "outcome=completed"
        description: "`failed` only. `abandoned` is an operator decision and `stopped_version_changed` has its own rule, because the three need different responses and one bucket would hide that."
        runbook: "docs/runbook-administrative-alerts.md#adm-backfill-run-failed"
    - uid: adm-backfill-failure-rate

# ADR-0009 — alert rules for the administrative-data surface. INF-156.
#
# The metric contract these read is GoGo-BE#463, merged in cf5989c and extended
# in dd3d1ee. Every metric and every label value below is taken from
# GoGo-BE/libs/observability/src/metric-labels.ts and
# GoGo-BE/docs/administrative-observability.md — not guessed, and asserted by
# scripts/ci/alerting-provisioning.test.sh.
#
# THREE RULES THIS FILE FOLLOWS, and the test enforces:
#
# 1. Never alert on the LEVEL of a known baseline. The pinned dataset ships with
#    1,033 unresolved rows, 1,370 simplification anomalies, 233 same-level
#    overlaps, 56 area outliers and 1 formatting warning. They are the data. The
#    backlog rules read delta() and the finding rules read severity="ERROR".
#
# 2. Counters are read through increase() over a window, never as a lifetime
#    total. A process restart resets a counter; a lifetime threshold would fire
#    on history and then never recover.
#
# 3. `or vector(0)` where absence genuinely means zero — a counter series does
#    not exist until its first increment, and "no failures yet" must not read as
#    NoData. It is deliberately ABSENT from the two guarded rules, where an
#    empty result means "not applicable" and NoData: OK says so honestly.
#
# BOOTSTRAP. All 39 series are absent until the BE build containing cf5989c is
# deployed, so every rule ships paused: `isPaused: ${GOGO_ADM_ALERTS_PAUSED}`,
# which defaults to true. Grafana's values.BoolValue expands the environment and
# then calls strconv.ParseBool, so an UNSET variable fails provisioning loudly
# rather than quietly resolving to "not paused". Activation is
# docs/runbook-administrative-alerts.md § Activation, after seven recorded
# conditions — never a side effect of a deploy.
#
# `no_data = OK` is not used to hide an uninstrumented system: adm-dataset-missing
# reads its gauge bare with noDataState: Alerting and is the sentinel for the
# whole family disappearing. That is exactly why these must not run before the
# metrics exist.
#
# Generated once from a table and then owned by hand. Editing a rule here is the
# whole change; there is no generator to re-run.
apiVersion: 1

groups:
  - orgId: 1
    name: administrative-data
    folder: GoGo Administrative Data
    # Equal to the scrape interval, never faster. Alloy scrapes GoGo-BE every
    # 60s (GoGo-BE/docker/alloy/config.alloy), so evaluating more often would
    # re-read the same sample and only move the moment a rule notices by less
    # than the data's own resolution.
    interval: 60s
    rules:
    - uid: adm-dataset-missing
      title: "Administrative dataset missing"
      condition: B
      data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: gogo-prometheus-local
          model:
            refId: A
            datasource:
              type: prometheus
              uid: gogo-prometheus-local
            editorMode: code
            expr: "max(administrative_dataset_active{env=\"dev\"})"
            instant: true
            range: false
            intervalMs: 60000
            maxDataPoints: 43200
        - refId: B
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            conditions:
              - evaluator:
                  type: lt
                  params:
                    - 1
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  type: last
                type: query
            intervalMs: 1000
            maxDataPoints: 43200
      for: 15m
      noDataState: Alerting
      execErrState: Error
      isPaused: ${GOGO_ADM_ALERTS_PAUSED}
      labels:
        service: administrative-data
        env: dev
        severity: high
      annotations:
        summary: "no published administrative dataset for 15m"
        impact: "no place can be approved; the domain guard refuses every publication"
        expected: "administrative_dataset_active = 1"
        description: "The sentinel rule. It reads the gauge bare, so a total disappearance of the administrative metric family lands here as NoData -> Alerting rather than being absorbed by another rule's `or vector(0)`. Every other rule in this group can therefore assume the family exists."
        runbook: "docs/runbook-administrative-alerts.md#adm-dataset-missing"
    - uid: adm-publication-blocked
      title: "Administrative publication blocked"
      condition: B
      data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: gogo-prometheus-local
          model:
            refId: A
            datasource:
              type: prometheus
              uid: gogo-prometheus-local
            editorMode: code
            expr: "count((max(administrative_publication_enabled{env=\"dev\"}) == 0) and on() (max(administrative_dataset_active{env=\"dev\"}) == 1))"
            instant: true
            range: false
            intervalMs: 60000
            maxDataPoints: 43200
        - refId: B
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            conditions:
              - evaluator:
                  type: gt
                  params:
                    - 0
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  type: last
                type: query
            intervalMs: 1000
            maxDataPoints: 43200
      for: 30m
      noDataState: OK
      execErrState: Error
      isPaused: ${GOGO_ADM_ALERTS_PAUSED}
      labels:
        service: administrative-data
        env: dev
        severity: high
      annotations:
        summary: "publication disabled for 30m while a dataset is published"
        impact: "places cannot be approved even though the dataset that would let them is live"
        expected: "administrative_publication_enabled = 1 whenever a dataset is published"
        description: "Guarded by dataset_active == 1 so it stays silent during bootstrap, when publication is correctly disabled because nothing is published yet. The guard is why NoData means OK here: an empty result is 'not applicable', not 'unknown'."
        runbook: "docs/runbook-administrative-alerts.md#adm-publication-blocked"
    - uid: adm-lifecycle-failed
      title: "Administrative dataset lifecycle failure"
      condition: B
      data:
        - refId: A
          relativeTimeRange:
            from: 1800
            to: 0
          datasourceUid: gogo-prometheus-local
          model:
            refId: A
            datasource:
              type: prometheus
              uid: gogo-prometheus-local
            editorMode: code
            expr: "sum(increase(administrative_dataset_operations_total{env=\"dev\",result=\"failed\"}[15m])) or vector(0)"
            instant: true
            range: false
            intervalMs: 60000
            maxDataPoints: 43200
        - refId: B
          relativeTimeRange:
            from: 1800
            to: 0
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            conditions:
              - evaluator:
                  type: gt
                  params:
                    - 0
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  type: last
                type: query
            intervalMs: 1000
            maxDataPoints: 43200
      for: 0s
      noDataState: OK
      execErrState: Error
      isPaused: ${GOGO_ADM_ALERTS_PAUSED}
      labels:
        service: administrative-data
        env: dev
        severity: high
      annotations:
        summary: "an import, validate, diff, publish or rollback failed in the last 15m"
        impact: "the dataset lifecycle is stuck; the operator who ran it is waiting on a fix"
        expected: "result=failed stays at 0"
        description: "`failed` only. GoGo-BE keeps `rejected` in a separate bucket on purpose: a refused publication is the policy working, and paging on it would train the channel away. Reads increase() over a window, never the lifetime counter."
        runbook: "docs/runbook-administrative-alerts.md#adm-lifecycle-failed"
    - uid: adm-validation-error
      title: "Administrative validation ERROR finding"
      condition: B
      data:
        - refId: A
          relativeTimeRange:
            from: 7200
            to: 0
          datasourceUid: gogo-prometheus-local
          model:
            refId: A
            datasource:
              type: prometheus
              uid: gogo-prometheus-local
            editorMode: code
            expr: "sum(increase(administrative_validation_findings_total{env=\"dev\",severity=\"ERROR\"}[1h])) or vector(0)"
            instant: true
            range: false
            intervalMs: 60000
            maxDataPoints: 43200
        - refId: B
          relativeTimeRange:
            from: 7200
            to: 0
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            conditions:
              - evaluator:
                  type: gt
                  params:
                    - 0
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  type: last
                type: query
            intervalMs: 1000
            maxDataPoints: 43200
      for: 0s
      noDataState: OK
      execErrState: Error
      isPaused: ${GOGO_ADM_ALERTS_PAUSED}
      labels:
        service: administrative-data
        env: dev
        severity: high
      annotations:
        summary: "a validation gate produced an ERROR finding in the last hour"
        impact: "the staged dataset cannot be published until the gate passes"
        expected: "ERROR findings stay at 0; WARNING findings are the baseline and never fire"
        baseline: "WARNING families are expected: 1,033 UNRESOLVED_CHANGES, 1,370 COMMUNE_OUTSIDE_PROVINCE, 233 SAME_LEVEL_OVERLAP, 56 AREA_OUTLIER, 1 SOURCE_FORMATTING"
        description: "Filters severity=ERROR. The WARNING families above are the pinned dataset's measured baseline; a rule on their level would fire forever on correct data."
        runbook: "docs/runbook-administrative-alerts.md#adm-validation-error"
    - uid: adm-boundary-missing
      title: "Administrative boundaries not loaded"
      condition: B
      data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: gogo-prometheus-local
          model:
            refId: A
            datasource:
              type: prometheus
              uid: gogo-prometheus-local
            editorMode: code
            expr: "count((max(administrative_boundary_active{env=\"dev\"}) == 0) and on() (max(administrative_dataset_active{env=\"dev\"}) == 1))"
            instant: true
            range: false
            intervalMs: 60000
            maxDataPoints: 43200
        - refId: B
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            conditions:
              - evaluator:
                  type: gt
                  params:
                    - 0
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  type: last
                type: query
            intervalMs: 1000
            maxDataPoints: 43200
      for: 30m
      noDataState: OK
      execErrState: Error
      isPaused: ${GOGO_ADM_ALERTS_PAUSED}
      labels:
        service: administrative-data
        env: dev
        severity: high
      annotations:
        summary: "no boundary release loaded for 30m while a dataset is published"
        impact: "the resolver runs PARTIAL: geometry answers nothing, so most places land in review"
        expected: "administrative_boundary_active = 1 whenever a dataset is published"
        description: "Same guard as adm-publication-blocked, for the same reason. PARTIAL is a degradation, not an outage \u2014 the resolver still answers from codes, names and the change mapping \u2014 which is why this is 30m and not 15m."
        runbook: "docs/runbook-administrative-alerts.md#adm-boundary-missing"
    - uid: adm-boundary-load-failed
      title: "Administrative boundary load failed"
      condition: B
      data:
        - refId: A
          relativeTimeRange:
            from: 7200
            to: 0
          datasourceUid: gogo-prometheus-local
          model:
            refId: A
            datasource:
              type: prometheus
              uid: gogo-prometheus-local
            editorMode: code
            expr: "sum(increase(administrative_boundary_loads_total{env=\"dev\",result=~\"failed|rejected\"}[1h])) or vector(0)"
            instant: true
            range: false
            intervalMs: 60000
            maxDataPoints: 43200
        - refId: B
          relativeTimeRange:
            from: 7200
            to: 0
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            conditions:
              - evaluator:
                  type: gt
                  params:
                    - 0
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  type: last
                type: query
            intervalMs: 1000
            maxDataPoints: 43200
      for: 0s
      noDataState: OK
      execErrState: Error
      isPaused: ${GOGO_ADM_ALERTS_PAUSED}
      labels:
        service: administrative-data
        env: dev
        severity: warning
      annotations:
        summary: "a boundary release was refused or failed to load in the last hour"
        impact: "the previously loaded release still serves; the new one did not take"
        expected: "result=loaded or result=unchanged"
        description: "`rejected` is included here, unlike the dataset lifecycle rule, because a refused boundary release leaves the operator with nothing loaded rather than with a working previous state to fall back to explaining."
        runbook: "docs/runbook-administrative-alerts.md#adm-boundary-load-failed"
    - uid: adm-boundary-validation-error
      title: "Administrative boundary validation ERROR"
      condition: B
      data:
        - refId: A
          relativeTimeRange:
            from: 7200
            to: 0
          datasourceUid: gogo-prometheus-local
          model:
            refId: A
            datasource:
              type: prometheus
              uid: gogo-prometheus-local
            editorMode: code
            expr: "sum(increase(administrative_boundary_findings_total{env=\"dev\",severity=\"ERROR\"}[1h])) or vector(0)"
            instant: true
            range: false
            intervalMs: 60000
            maxDataPoints: 43200
        - refId: B
          relativeTimeRange:
            from: 7200
            to: 0
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            conditions:
              - evaluator:
                  type: gt
                  params:
                    - 0
                operator:
                  type: and
                query:
                  params:
                    - A

title = "GoGo secret scanning"

[extend]
useDefault = true

[[rules]]
id = "gogo-apns-auth-key"
description = "Apple APNs .p8 auth key"
regex = '''-----BEGIN PRIVATE KEY-----'''
tags = ["apple", "apns", "key"]

[[rules]]
id = "gogo-firebase-service-account"
description = "Firebase / Google service account JSON"
regex = '''"type"\s*:\s*"service_account"'''
tags = ["gcp", "firebase"]

[[rules]]
id = "gogo-onesignal-rest-key"
description = "OneSignal REST API key header"
regex = '''(?i)(onesignal[_-]?rest[_-]?api[_-]?key)\s*[:=]\s*['\"]?[A-Za-z0-9_\-]{20,}'''
tags = ["onesignal"]

[[rules]]
id = "gogo-postgres-url"
description = "PostgreSQL connection string with credentials"
# (?:ql) is non-capturing on purpose. With a capturing group, gitleaks reports
# group 1 as the Secret — this rule used to report `ql` — and allowlist regexes
# are matched against the Secret, so no allowlist entry could ever apply to it.
# It also made a genuine finding useless: the report named `ql` instead of the
# password that leaked.
regex = '''postgres(?:ql)?://[^:\s]+:[^@\s]+@'''
tags = ["database"]

[[rules]]
id = "gogo-redis-url"
description = "Redis connection string with credentials"
regex = '''rediss?://[^:\s]*:[^@\s]+@'''
tags = ["redis"]

[[rules]]
id = "gogo-discord-webhook-url"
description = "Discord channel webhook URL (carries its own token)"
# GoGo-Infra#221. Discord's execute URL is the credential: whoever holds it can
# post into the channel, with no account and no further authentication. The
# relay Worker receives its three URLs from SSM through put-worker-secret.sh and
# never prints one — this rule is what makes a pasted URL fail CI instead of
# living in a commit, a fixture or an evidence file.
#
# Non-capturing on the id/token split, for the reason gogo-postgres-url records:
# a capturing group makes gitleaks report the group as the Secret, and allowlist
# regexes are matched against the Secret.
regex = '''https://discord(?:app)?\.com/api/webhooks/[0-9]{17,20}/[A-Za-z0-9_-]{20,}'''
tags = ["discord", "webhook"]

[allowlist]
description = "Placeholders and documentation examples"
regexes = [
  '''<[A-Z_]+>''',
  '''postgres(?:ql)?://USER:PASSWORD@''',
  '''rediss?://default:PASSWORD@''',
  # A shell variable in the credential position is code that builds a URL, not
  # a URL. scripts/bootstrap/upstash.sh assembles REDIS_URL this way and pipes
  # it straight into SSM without ever printing it.
  #
  # Deliberately narrow: the variable must sit exactly where the password goes.
  # A literal password still trips the rule, which is the whole point — the
  # alternative on offer was a per-commit fingerprint ignore, which stops
  # matching the moment the line moves and silently protects nothing.
  '''(?:rediss?|postgres(?:ql)?)://[^:@\s]*:\$\{?[A-Za-z_][A-Za-z0-9_]*\}?@''',
  '''EXAMPLE|PLACEHOLDER|CHANGEME|xxxxx''',
]
paths = [
  '''\.env\.example$''',
  # .yml, not .yaml. The file has always been secrets.manifest.yml, so this
  # entry matched nothing from the day it was written.
  '''secrets\.manifest\.ya?ml$''',
]

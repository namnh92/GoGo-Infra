# GoGo secret manifest — NAMES AND DESCRIPTIONS ONLY.
#
# Never put a secret value in this file. This is the contract that
# `scripts/secrets/validate.sh` diffs against AWS SSM Parameter Store, and the
# contract GoGo-BE validates with Zod at startup (SRS §6.3).
#
# path      : SSM path suffix under /gogo/<env>/backend/
# env_var   : normalized environment variable consumed by the application
# type      : SecureString | String
# required  : environments where startup must fail if the value is missing
#
# Rule: one parameter per independently permissioned value. No JSON blobs.

version: 1

parameters:
  - path: database/url
    env_var: DATABASE_URL
    type: SecureString
    required: [dev, staging, prod]
    description: PostgreSQL connection string. Must be the POOLED endpoint.

  - path: redis/url
    env_var: REDIS_URL
    type: SecureString
    required: [dev, staging, prod]
    description: Redis connection string (TCP, not REST — BullMQ needs blocking commands).

  - path: r2/endpoint
    env_var: R2_ENDPOINT
    type: String
    required: [dev, staging, prod]
    description: S3-compatible R2 endpoint for the account.

  - path: r2/bucket
    env_var: R2_BUCKET
    type: String
    required: [dev, staging, prod]
    description: Asset bucket name for this environment (gogo-<env>-assets).

  - path: r2/access-key-id
    env_var: R2_ACCESS_KEY_ID
    type: SecureString
    required: [dev, staging, prod]
    description: R2 API token access key id, scoped to the environment bucket only.

  - path: r2/secret-access-key
    env_var: R2_SECRET_ACCESS_KEY
    type: SecureString
    required: [dev, staging, prod]
    description: R2 API token secret.

  - path: auth/jwt-secret
    env_var: JWT_SECRET
    type: SecureString
    required: [dev, staging, prod]
    description: Access token signing secret. Never shared between environments.

  - path: auth/refresh-secret
    env_var: REFRESH_TOKEN_SECRET
    type: SecureString
    required: [dev, staging, prod]
    description: Refresh token signing secret with revoke chain.

  - path: onesignal/app-id
    env_var: ONESIGNAL_APP_ID
    type: String
    required: [dev, prod]
    description: OneSignal application id. Client configuration, not a secret.

  - path: onesignal/rest-api-key
    env_var: ONESIGNAL_REST_API_KEY
    type: SecureString
    required: [dev, prod]
    description: OneSignal REST API key used by the notification worker only.

  - path: onesignal/identity-verification-key
    env_var: ONESIGNAL_IDENTITY_VERIFICATION_KEY
    type: SecureString
    required: [prod]
    description: ES256 key used to sign OneSignal identity JWTs (NTF-BE-008). Never ships in the mobile bundle.

  - path: tenjin/api-key
    env_var: TENJIN_API_KEY
    type: SecureString
    required: [prod]
    description: Tenjin API key used to build tracking URLs server-side.

  - path: google/server-api-key
    env_var: GOOGLE_PLACES_API_KEY
    type: SecureString
    required: [dev, staging, prod]
    description: Server-side Google Places key. Never exposed to any client.

  - path: google/routes-api-key
    env_var: GOOGLE_ROUTES_API_KEY
    type: SecureString
    required: [dev, staging, prod]
    description: Server-side Google Routes key, separate from Places for quota isolation.

# GoGo secret manifest — NAMES AND DESCRIPTIONS ONLY.
#
# Never put a secret value in this file. This is the contract that
# `scripts/secrets/validate.sh` diffs against AWS SSM Parameter Store, and the
# contract GoGo-BE validates with Zod at startup (SRS §6.3).
#
# path      : SSM path suffix under /gogo/<env>/backend/
# env_var   : normalized environment variable consumed by the application
# type      : SecureString | String
# required  : environments where startup must fail if the value is missing
#
# Rule: one parameter per independently permissioned value. No JSON blobs.

version: 1

parameters:
  - path: database/url
    env_var: DATABASE_URL
    type: SecureString
    required: [dev, staging, prod]
    description: PostgreSQL connection string. Must be the POOLED endpoint.

  - path: redis/url
    env_var: REDIS_URL
    type: SecureString
    required: [dev, staging, prod]
    description: Redis connection string (TCP, not REST — BullMQ needs blocking commands).

  - path: r2/endpoint
    env_var: R2_ENDPOINT
    type: String
    required: [dev, staging, prod]
    description: S3-compatible R2 endpoint for the account.

  - path: r2/bucket
    env_var: R2_BUCKET
    type: String
    required: [dev, staging, prod]
    description: Asset bucket name for this environment (gogo-<env>-assets).

  - path: r2/access-key-id
    env_var: R2_ACCESS_KEY_ID
    type: SecureString
    required: [dev, staging, prod]
    description: R2 API token access key id, scoped to the environment bucket only.

  - path: r2/secret-access-key
    env_var: R2_SECRET_ACCESS_KEY
    type: SecureString
    required: [dev, staging, prod]
    description: R2 API token secret.

  # These names are the ones apps/api/src/config/env.ts actually reads.
  #
  # They used to be JWT_SECRET and REFRESH_TOKEN_SECRET, which the application
  # reads nowhere. validate.sh reported dev as healthy because it compares SSM
  # against this file and never against the schema the application validates on
  # startup — so the first deploy shipped a complete env file and the API
  # crash-looped on four missing variables. See INF-046.
  - path: auth/jwt-secret
    env_var: AUTH_JWT_SECRET
    type: SecureString
    required: [dev, staging, prod]
    description: Access token signing secret, minimum 32 characters in production. Never shared between environments.

  - path: auth/cookie-secret
    env_var: COOKIE_SECRET
    type: SecureString
    required: [dev, staging, prod]
    description: Signs session cookies, minimum 32 characters in production.

  - path: auth/cms-mfa-encryption-key
    env_var: CMS_MFA_ENCRYPTION_KEY
    type: SecureString
    required: [dev, staging, prod]
    description: Encrypts admin TOTP secrets at rest (SEC-004). Without it a database dump hands over every second factor.

  - path: auth/cookie-secure
    env_var: COOKIE_SECURE
    type: String
    required: [dev, staging, prod]
    description: Must be true wherever the API is served over TLS. Not a credential; declared because the application refuses to start in production without it.

  # Cloudflare Access identity, verified by GoGo-BE (its ADR-0010). Neither is a
  # credential — the team domain is a public hostname and the audience tag is an
  # application id — but both are declared so validate.sh fails loudly instead of
  # SSO turning itself off quietly.
  #
  # Required in production only. The security rule is SSO/MFA for the CMS there;
  # in dev, present means SSO is on, absent means password plus TOTP.
  #
  # Setting one without the other is the dangerous half-state: a team domain with
  # no audience accepts an assertion minted for ANY other application in the same
  # Cloudflare account, because Access signs every application in a team with the
  # same keys — a different door with a different allow list.
  - path: access/team-domain
    env_var: CF_ACCESS_TEAM_DOMAIN
    type: String
    required: [prod]
    description: "<team>.cloudflareaccess.com — also the host publishing the JWKS GoGo-BE verifies against."

  - path: access/aud
    env_var: CF_ACCESS_AUD
    type: String
    required: [prod]
    description: Audience tag of the Access application, i.e. its application id. Terraform output cms_access_aud. Not a hostname.

  - path: onesignal/app-id
    env_var: ONESIGNAL_APP_ID
    type: String
    required: [dev, prod]
    description: OneSignal application id. Client configuration, not a secret.

  - path: onesignal/rest-api-key
    env_var: ONESIGNAL_REST_API_KEY
    type: SecureString
    required: [dev, prod]
    description: OneSignal REST API key used by the notification worker only.

  - path: onesignal/identity-verification-key
    env_var: ONESIGNAL_IDENTITY_VERIFICATION_KEY
    type: SecureString
    required: [prod]
    description: ES256 key signing OneSignal identity JWTs (NTF-BE-008). Required for production release; never ships in the mobile bundle.

  # No Tenjin parameter. Tenjin has no credential called a "server API key" —
  # that name was invented here. What exists is:
  #
  #   SDK Key            per app, from Apps → <app> → SDK Key. Client config,
  #                      shipped in the mobile binary. Also what S2S event
  #                      posting authenticates with, if that is ever used.
  #   API Access Token   from AUTOMATE → API Access Tokens. Only for the
  #                      Automation, Reporting, Campaign Management and Raw Data
  #                      Export APIs.
  #
  # GoGo-BE calls neither. TenjinAcquisitionLinkProvider composes a tracking URL
  # from a template and injects deeplink_url — string building, not an
  # authenticated request. Minting a token so that a checklist turns green would
  # create a real credential, with a real blast radius, guarding nothing.
  #
  # If GoGo-BE later needs the Automation API:
  #   path: tenjin/api-access-token   env_var: TENJIN_API_ACCESS_TOKEN
  # If it needs S2S event posting, reuse that app's SDK Key. Do not mint a
  # second credential for it.

  - path: google/server-api-key
    env_var: GOOGLE_PLACES_API_KEY
    type: SecureString
    required: [dev, staging, prod]
    description: Server-side Google Places key. Never exposed to any client.

  - path: google/routes-api-key
    env_var: GOOGLE_ROUTES_API_KEY
    type: SecureString
    required: [dev, staging, prod]
    description: Server-side Google Routes key, separate from Places for quota isolation.

  # Poll intervals for the BullMQ schedulers, in milliseconds. Not secret, and
  # optional everywhere — the application defaults to 5000.
  #
  # DEV sets these higher because Upstash bills per command: two schedulers at
  # 5s exceed the free tier before any job exists (INF-009). Production leaves
  # them unset and keeps the default.
  - path: worker/outbox-poll-ms
    env_var: OUTBOX_POLL_MS
    type: String
    required: [dev, staging, prod]
    description: >-
      Outbox relay poll interval in ms. Required, not optional: the application default is 5000,
      which is ~207,000 Redis commands a day against an Upstash free budget of ~16,600. An
      environment that omits this spends a month of free tier in about two days, and the symptom
      is the queue going quiet rather than an error.

  - path: worker/ingest-poll-ms
    env_var: INGEST_POLL_MS
    type: String
    required: [dev, staging, prod]
    description: >-
      Place-ingest poll interval in ms. Required for the same reason as the outbox interval: the
      5000 default is twelve times the free command budget, and falling back to it fails silently.

  # Ingress configuration. Not secret, and not optional: the compose stack fails
  # to start without them (`DOMAIN: ${DOMAIN:?set DOMAIN}`), so a deploy that
  # omits them dies at the first container rather than at a check.
  #
  # Named for the role, not the tool. Caddy terminates TLS today; the contract is
  # "the hostname this environment answers on" and survives replacing it.
  - path: ingress/domain
    env_var: DOMAIN
    type: String
    required: [dev, prod]
    description: Hostname the environment serves the API on, e.g. api-dev.gogo.id.vn. Drives the TLS certificate, so it must match the DNS record.

  - path: ingress/acme-email
    env_var: ACME_EMAIL
    type: String
    required: [dev, prod]
    description: Contact address Let's Encrypt uses for expiry and revocation notices. Not a credential; kept in SSM rather than committed because it is a personal address.

  # The connector's credential. Only environments whose host has no inbound
  # connectivity need it, which today is dev — production gets a host with open
  # ports, and an unused connector token there would be a credential guarding
  # nothing.
  - path: tunnel/token
    env_var: TUNNEL_TOKEN
    type: SecureString
    required: [dev]
    description: Cloudflare tunnel connector token. Enough on its own to run a connector for the tunnel, so it is written from terraform output straight into SSM and never printed.

  - path: observability/sentry-dsn
    env_var: SENTRY_DSN
    type: String
    required: [prod]
    description: Sentry DSN for the api and worker processes. Config, not a credential — it ships in clients anyway. The release upload token is a separate CI credential.

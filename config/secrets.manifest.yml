# GoGo secret manifest — NAMES AND DESCRIPTIONS ONLY.
#
# Never put a secret value in this file. This is the contract that
# `scripts/secrets/validate.sh` diffs against AWS SSM Parameter Store, and the
# contract GoGo-BE validates with Zod at startup (SRS §6.3).
#
# path      : SSM path suffix under /gogo/<env>/<namespace>/
# namespace : backend (default, omitted) | mobile — see below
# env_var   : normalized environment variable consumed by the application.
#             Omit it where nothing exports one (a file-based credential); the
#             reader emits "-" so column positions stay fixed for callers that
#             read the output positionally.
# type      : SecureString | String
# required  : environments where startup must fail if the value is missing
# consumer  : runtime (default, omitted) | seed | observability | pipeline |
#             terraform — see below
# infra_readable : true only on a `String` the Terraform plan/apply roles may
#             read (GoGo-Infra#194, ADR-0010). `put.sh --infra-readable` adds the
#             tag gogo:infra-readable=true that IAM keys on. Never on a
#             SecureString — put.sh refuses, validate.sh reports it.
#
# Rule: one parameter per independently permissioned value. No JSON blobs.
#
# Namespaces exist because `backend` is not a label, it is a blast radius.
# Every parameter in it is rendered into the API's runtime env file by
# scripts/deploy/render-env.sh and readable by the deploy role, so a value
# placed there is handed to the server whether the server wants it or not.
#
#   backend  server-side runtime values. Read by GoGo-BE, validated with Zod
#            at startup, rendered into .env.runtime and the deployed env file.
#   mobile   values a mobile *build* needs. Baked into the binary at prebuild,
#            never read by GoGo-BE, never rendered into a server env file.
#            Read by the developer role (and, when one exists, a mobile build
#            job) — not by the deploy or monitor roles.
#
# `consumer` is the second, independent question, and it exists because
# namespace could not answer it. Namespace picks the SSM prefix; two values can
# belong under `backend` — same IAM, same deploy role — and still have no
# business being in the same process. INF-069:
#
#   runtime  the API and worker load it. Rendered into .env.runtime and the
#            deployed env file by render-env.sh and pull.sh.
#   seed     a one-off provisioning command loads it, and nothing else does.
#            NOT rendered into the shared runtime env file, so it is absent
#            from the process environment of the two internet-facing
#            processes. The CMS bootstrap password is the case that forced
#            this: `backend` is the right prefix for it, and the API's
#            /proc/self/environ is the wrong place for it. No row uses it
#            today: the bootstrap rows were retired by GoGo-Infra#194 when
#            the super admin moved to Access only (GoGo-BE#687).
#   observability
#            the observability host (192.168.68.168) loads it; nothing on the BE
#            host does. Same argument as `seed` with a different reader: the
#            Grafana Telegram credential (ADR-0009) belongs under `backend` —
#            same IAM, same deploy and monitor roles — and belongs nowhere near
#            the API's environment. Rendered by
#            observability/local-grafana/bin/render-alerting-env.sh.
#   pipeline a CI job loads it, or an operator hands it to exactly one build
#            command on their own machine through scripts/secrets/exec-with.sh
#            (GoGo-Infra#222: the mobile release build has no CI job yet). Lives
#            in the `ci` namespace under /gogo/ci/<env>/…, is never rendered by
#            render-env.sh, pull.sh or mobile-env.py into a runtime, seed,
#            observability or mobile env file (scripts/lib/manifest.test.sh pins
#            that), and is the only consumer whose credentials can change
#            infrastructure. INF-171.
#   terraform
#            Terraform reads it through `data "aws_ssm_parameter"` and nothing
#            else does. Visible to validate.sh, put.sh and the offboarding
#            checklist; rendered by nothing — never into a runtime, seed, build
#            or observability env file. GoGo-Infra#194: the CMS Access staff
#            list is the case that forced it (it has no env_var).
#
# Tooling treats `backend` and `runtime` as the defaults: scripts/lib/manifest.py
# emits only those unless asked otherwise, so every consumer that predates
# either field keeps the scope it was written with. Anything that must see the
# whole manifest — validate.sh, put.sh, the offboarding rotation checklist —
# asks for it explicitly, because a credential nobody validates and nobody
# rotates is worse than one nobody rendered.

version: 1

parameters:
  - path: database/url
    env_var: DATABASE_URL
    type: SecureString
    required: [dev, staging, prod]
    description: PostgreSQL connection string. Must be the POOLED endpoint.

  - path: redis/url
    env_var: REDIS_URL
    type: SecureString
    required: [dev, staging, prod]
    description: Redis connection string (TCP, not REST — BullMQ needs blocking commands).

  - path: r2/endpoint
    env_var: R2_ENDPOINT
    type: String
    required: [dev, staging, prod]
    description: >-
      S3-compatible R2 endpoint for the account, https://<account>.r2.cloudflarestorage.com.
      Its first label is the account id: GoGo-BE resolves R2_ACCOUNT_ID from it when that
      variable is not set, and refuses to boot with an R2 credential it cannot resolve an
      account for (GoGo-BE#548). This is why no r2/account-id row exists.

  - path: r2/bucket
    env_var: R2_BUCKET
    type: String
    required: [dev, staging, prod]
    description: Asset bucket name for this environment (gogo-<env>-assets).

  - path: r2/access-key-id
    env_var: R2_ACCESS_KEY_ID
    type: SecureString
    required: [dev, staging, prod]
    description: R2 API token access key id, scoped to the environment bucket only.

  - path: r2/secret-access-key
    env_var: R2_SECRET_ACCESS_KEY
    type: SecureString
    required: [dev, staging, prod]
    description: R2 API token secret.

  # PROF-INF-001 (#163), GoGo-BE ADR-0022 / ADR-0005 addendum — the public
  # bucket the edge serves, under its own token. The private token above keeps
  # no write access to it; a processed avatar is the only thing the API writes
  # there. All three or none: the API refuses a bucket without a credential and
  # a credential without a bucket at boot. Optional in every environment: without
  # them the API still boots, GET /me reports capabilities.avatarUpload =
  # unavailable, and the mobile control renders disabled with the reason.
  - path: r2/public-bucket
    env_var: R2_PUBLIC_BUCKET
    type: String
    required: []
    description: Public bucket the edge serves for this environment (gogo-<env>-public).

  - path: r2/public-access-key-id
    env_var: R2_PUBLIC_ACCESS_KEY_ID
    type: SecureString
    required: []
    description: >-
      R2 API token access key id scoped to the public bucket only, Object Read & Write. Never
      the same token as r2/access-key-id: a leaked private-bucket token must not be able to
      publish, and a leaked public-bucket token must not be able to read check-in photos.

  - path: r2/public-secret-access-key
    env_var: R2_PUBLIC_SECRET_ACCESS_KEY
    type: SecureString
    required: []
    description: Secret for r2/public-access-key-id.

  # PROF-INF-002 (#165) — the public base URL is part of the avatar capability,
  # not decoration: AVATAR_STORAGE_CONFIGURED requires it, so without this row
  # the three credentials above still leave GET /me reporting
  # capabilities.avatarUpload = unavailable. Deploying the credentials without
  # it is the one combination that looks configured and is not.
  - path: media/public-base-url
    env_var: MEDIA_PUBLIC_BASE_URL
    type: String
    required: []
    description: >-
      Public origin the edge serves the public bucket from, no trailing slash — the
      assets_host of this environment (dev: https://assets-dev.gogo.id.vn). Also the base for
      place imagery (GoGo-BE#151); empty means the API omits photo URLs rather than emitting
      one that cannot load.

  # These names are the ones apps/api/src/config/env.ts actually reads.
  #
  # They used to be JWT_SECRET and REFRESH_TOKEN_SECRET, which the application
  # reads nowhere. validate.sh reported dev as healthy because it compares SSM
  # against this file and never against the schema the application validates on
  # startup — so the first deploy shipped a complete env file and the API
  # crash-looped on four missing variables. See INF-046.
  - path: auth/jwt-secret
    env_var: AUTH_JWT_SECRET
    type: SecureString
    required: [dev, staging, prod]
    description: Access token signing secret, minimum 32 characters in production. Never shared between environments.

  - path: auth/cookie-secret
    env_var: COOKIE_SECRET
    type: SecureString
    required: [dev, staging, prod]
    description: Signs session cookies, minimum 32 characters in production.

  # auth/cms-mfa-encryption-key retired 2026-10-08 (GoGo-BE#687 R8): CMS TOTP is gone
  # (alpha.72), its columns were dropped (migration 0075) and GoGo-BE no longer reads
  # CMS_MFA_ENCRYPTION_KEY. Manifest row first; the SSM parameter is deleted after.

  - path: auth/cookie-secure
    env_var: COOKIE_SECURE
    type: String
    required: [dev, staging, prod]
    description: Must be true wherever the API is served over TLS. Not a credential; declared because the application refuses to start in production without it.

  # Cloudflare Access identity, verified by GoGo-BE (its ADR-0010). Neither is a
  # credential — the team domain is a public hostname and the audience tag is an
  # application id — but both are declared so validate.sh fails loudly instead of
  # SSO turning itself off quietly.
  #
  # Required in production only. The security rule is SSO/MFA for the CMS there;
  # in dev, present means SSO is on. Whether the password door is also open is a
  # separate switch, cms/password-login-enabled below (GoGo-BE ADR-0032).
  #
  # Setting one without the other is the dangerous half-state: a team domain with
  # no audience accepts an assertion minted for ANY other application in the same
  # Cloudflare account, because Access signs every application in a team with the
  # same keys — a different door with a different allow list.
  - path: access/team-domain
    env_var: CF_ACCESS_TEAM_DOMAIN
    type: String
    required: [prod]
    description: "<team>.cloudflareaccess.com — also the host publishing the JWKS GoGo-BE verifies against."

  - path: access/aud
    env_var: CF_ACCESS_AUD
    type: String
    required: [prod]
    description: Audience tag of the Access application, i.e. its application id. Terraform output cms_access_aud. Not a hostname.

  # GoGo-BE#679 / ADR-0032. The CMS password door, independent of SSO so that
  # turning Access on and turning the password off are two deploys with an
  # observation between them. Absent means the API default, `true` (open).
  # `false` is refused at boot unless access/* is set, so no value leaves the
  # console without a door. Rollback: put `true`, redeploy.
  #
  # Required nowhere — but render-env.sh aborts on any read error other than
  # ParameterNotFound (GoGo-Infra#187), so an existing `false` can never render
  # as absent and silently re-open the door.
  - path: cms/password-login-enabled
    env_var: CMS_PASSWORD_LOGIN_ENABLED
    type: String
    required: []
    description: "`true` or `false`. `false` = the CMS accepts only Cloudflare Access sign-in, for every role (GoGo-BE#679; DEV ran this on 2026-10-06 and was rolled back to `true` the same day). Not a credential."

  # GoGo-BE#687 / ADR-0034. Narrower than the row above: only the super_admin
  # signs in through Access; other roles follow cms/password-login-enabled.
  # Absent means the API default, `false`. `true` is refused at boot unless
  # access/* is set. A failed read aborts the deploy (render-env.sh), so a
  # stored `true` can never render as absent.
  #
  # This row is a floor: while SSM holds `true`, dispatch deploy-dev only from
  # an Infra ref that has it. An older manifest does not render the variable,
  # and the API then reads `false` — the super admin's password door re-opens.
  - path: cms/super-admin-sso-only
    env_var: CMS_SUPER_ADMIN_SSO_ONLY
    type: String
    required: []
    description: "`true` or `false`. `true` = the super_admin signs in through Cloudflare Access only; other roles follow cms/password-login-enabled. Not a credential."

  # GoGo-BE#687 (ADR-0034 amendment) / GoGo-Infra#194 (ADR-0010). The one
  # super_admin's address, read by two consumers from one value: GoGo-BE renders
  # it as CMS_SUPER_ADMIN_EMAIL and syncs the admin row to it at deploy; Terraform
  # reads it for the cms-<env> Access allow list. A String tagged
  # gogo:infra-readable=true by `put.sh --infra-readable` — the tag plus an
  # exact-ARN grant is what lets the plan/apply roles read this one name and
  # nothing else under backend/. It replaces cms/seed-admin-email (retired).
  # SSM change => terraform-apply, then deploy-dev, in that order
  # (docs/secrets.md, "super_admin through Access only").
  - path: cms/super-admin-email
    env_var: CMS_SUPER_ADMIN_EMAIL
    type: String
    required: [dev, staging, prod]
    infra_readable: true
    description: Address of the single CMS super_admin. Not a credential; an allow-list entry.

  # Staff admitted to cms-<env> by Access (editor / moderator / ops_admin).
  # Terraform only: no env_var, never rendered. A JSON array inside a String —
  # "[]" is allowed, which a StringList cannot hold. The super admin edits it
  # with `put.sh --infra-readable` and dispatches terraform-apply-<env>.
  - path: cms/access-staff-emails
    type: String
    required: [dev, staging, prod]
    consumer: terraform
    infra_readable: true
    description: JSON array of staff addresses for the Access allow list, e.g. ["a@example.com"] or [].

  # Every deployed environment runs the same push code (GoGo-BE#193): the
  # build selects OneSignal, and a missing value binds a provider that refuses
  # every send and says so at boot — never a silent fake. So the two values a
  # send needs are required wherever a GoGo environment exists, staging included.
  - path: onesignal/app-id
    env_var: ONESIGNAL_APP_ID
    type: String
    required: [dev, staging, prod]
    description: OneSignal application id (UUID). Client configuration, not a secret. One app per environment.

  - path: onesignal/rest-api-key
    env_var: ONESIGNAL_REST_API_KEY
    type: SecureString
    required: [dev, staging, prod]
    description: >-
      OneSignal App API key ("Key" scheme on api.onesignal.com), read by the worker to send and by
      the API to report readiness. Never the identity signing key below, which is a different key.

  - path: onesignal/identity-verification-key
    env_var: ONESIGNAL_IDENTITY_VERIFICATION_KEY
    type: SecureString
    required: [prod]
    description: ES256 key signing OneSignal identity JWTs (NTF-BE-008). Required for production release; never ships in the mobile bundle.

  # ── Canonical share links (LNK-BE-002 / LNK-BE-003, GoGo-BE#205/#206) ────
  #
  # Both are plain configuration. The API mints https://<share-link/base-url>/l/{slug}
  # and, when a template is present, stores the Tenjin click URL with
  # deeplink_url=<canonical> on the row. Empty template = links carry
  # provider NONE and keep working; only install attribution is absent.
  - path: share-link/base-url
    env_var: SHARE_LINK_BASE_URL
    type: String
    required: [dev, staging, prod]
    description: >-
      https origin of this environment's share-link host, e.g. https://go-dev.gogo.id.vn
      (the Worker in terraform/modules/cloudflare-worker, var share_host). No path or query:
      everything after the host is the slug. Empty makes POST /v1/share-links answer 503.

  # INF-070 / GoGo-BE SEC-004. The share-link Worker calls the API
  # server-to-server, so without this every click reaches the API as one of a
  # handful of Cloudflare egress addresses: the per-visitor rate limit on
  # GET /v1/share-links/{slug} becomes a ceiling shared by the whole product
  # and tells no two visitors apart. The Worker presents this token, and only
  # then does the API believe the address it forwards — and only for that one
  # limit.
  #
  # Per environment, never shared: one value that works in DEV and PROD lets
  # DEV's edge speak for PROD's. Empty is a safe state, not a broken one — the
  # API trusts no edge, strips the header from every request, and keys the
  # limit on the connecting address exactly as it did before.
  #
  # Optional in every environment *today* for one reason: `api_origin` is empty
  # until INF-037, so the Worker never calls the API and there is nothing for a
  # token to authenticate. It becomes required in the same change that sets
  # `api_origin` — that is the deploy where an absent token would silently mean
  # one rate-limit bucket for every visitor in the product.
  - path: share-link/worker-auth-token
    env_var: SHARE_LINK_EDGE_AUTH_TOKEN
    type: SecureString
    required: []
    description: >-
      Shared token proving a request came from this environment's share-link Worker
      (header X-GoGo-Edge-Auth). At least 32 characters of random, generated per environment;
      the API refuses a shorter one at boot. The API reads it through render-env.sh; the Worker
      gets it from scripts/secrets/put-worker-secret.sh, which pipes it straight from here to
      Cloudflare. Terraform never receives it — it only records whether the binding exists and
      preserves it with the Workers API's `inherit` type. Runbook: docs/share-link-edge-auth.md.

  - path: tenjin/tracking-url-template
    env_var: TENJIN_TRACKING_URL_TEMPLATE
    type: String
    required: []
    description: >-
      Tenjin campaign click URL for this environment's app; GoGo-BE appends deeplink_url only.
      Not a credential. Absent until the App Store Connect app and the Tenjin campaign exist
      (INF-014). Keep it equal to the Worker's tenjin_tracking_template for the same env.

  # No Tenjin credential. Tenjin has no credential called a "server API key" —
  # that name was invented here. What exists is:
  #
  #   SDK Key            per app, from Apps → <app> → SDK Key. Client config,
  #                      shipped in the mobile binary. Also what S2S event
  #                      posting authenticates with, if that is ever used.
  #   API Access Token   from AUTOMATE → API Access Tokens. Only for the
  #                      Automation, Reporting, Campaign Management and Raw Data
  #                      Export APIs.
  #
  # GoGo-BE calls neither. TenjinAcquisitionLinkProvider composes a tracking URL
  # from a template and injects deeplink_url — string building, not an
  # authenticated request. Minting a token so that a checklist turns green would
  # create a real credential, with a real blast radius, guarding nothing.
  #
  # If GoGo-BE later needs the Automation API:
  #   path: tenjin/api-access-token   env_var: TENJIN_API_ACCESS_TOKEN
  # If it needs S2S event posting, reuse that app's SDK Key. Do not mint a
  # second credential for it.

  # One key per Google API, none covering for another. Each is restricted to its
  # own API in the console, so a shared key does not degrade gracefully — it
  # returns 403 API_KEY_SERVICE_BLOCKED, which reads like a permission problem
  # with whatever was being fetched. Separate keys are also what isolates quota
  # and bounds the damage when one leaks.
  #
  # GoGo-BE read none of these names until GoGo-BE#272: apps/api/src/config/env.ts
  # declared GOOGLE_MAPS_API_KEY and used it for Places, so SSM held the right
  # key under a name nothing consumed and every environment served
  # FakePlaceProvider. validate.sh reported dev healthy throughout, because it
  # compares SSM against this file and never against the schema the application
  # validates on startup. The fix belongs on the application side: the name here
  # describes the key, and the code now reads it.
  #
  # That validate.sh blind spot used to be filed here as "INF-046 again", which
  # was wrong — INF-046 is the DEV seed issue. It had no issue of its own until
  # INF-052, which also adds `make provider-keys`: names and types matching this
  # file says nothing about whether Google will accept the value, and DEV spent
  # weeks proving it.
  - path: google/server-api-key
    env_var: GOOGLE_PLACES_API_KEY
    type: SecureString
    required: [dev, staging, prod]
    description: Server-side Google Places key. Never exposed to any client.

  - path: google/routes-api-key
    env_var: GOOGLE_ROUTES_API_KEY
    type: SecureString
    required: [dev, staging, prod]
    description: Server-side Google Routes key, separate from Places for quota isolation.

  # Its own key rather than a fallback to the Places key: the CMS bulk import is
  # the only caller, Sheets bills and throttles separately, and a leaked import
  # key should not also buy Places calls.
  #
  # Absent, GoGo-BE does not fail — providers.module.ts falls back to FakeSheets,
  # and FakeSheets answers a real spreadsheet id with SHEET_NOT_FOUND. The CMS
  # then tells an editor the sheet does not exist while the sheet is fine, which
  # is why this is required in every environment instead of optional: a missing
  # value has to break a deploy, not a workflow.
  - path: google/sheets-api-key
    env_var: GOOGLE_SHEETS_API_KEY
    type: SecureString
    required: [dev, staging, prod]
    description: Server-side Google Sheets key for CMS bulk import. Read-only scope, separate quota from Places.

  # ── Provider cost: the ledger, and the ceiling that stops it ────────────────
  #
  # INF-057. Two groups that read alike and behave in opposite ways when a value
  # is missing, which is the whole reason they are documented together.
  #
  # The ledger pair (GoGo-BE#335, shipped) defaults **on** in code
  # (apps/api/src/config/env.ts): `COST_LEDGER_ENABLED=true`,
  # `COST_LEDGER_FLUSH_MS=5000`. Every deployed environment is already writing
  # `provider_usage_daily` without a single parameter here. Declaring them does
  # not turn anything on — it makes the running values visible and changeable
  # without a code deploy, and gives the PR2 rollback ("stop writing the ledger")
  # somewhere to be performed.
  #
  # `COST_LEDGER_FLUSH_MS=5000` is not yet verified. ADR-0012's
  # "POST-MERGE VALIDATION REQUIRED" owes three DEV measurements — flush
  # duration, freshness lag, and whether five seconds is the right window — and
  # they need Postgres DEV access this repository does not have today. When the
  # numbers exist the value may have to change, which is the argument for it
  # being a parameter rather than a constant.
  #
  # The budget ceilings (GoGo-BE#340, PR7, not yet shipped) default **closed**.
  # An unset ceiling is a REFUSAL, never "unlimited" — verbatim from
  # libs/modules/cost/application/provider-budget.service.ts:
  #
  #   maxCalls === null || maxCostMicros === null  →  refuse 'not_configured'
  #   maxUnitsByOperation[operation] === undefined →  refuse 'operation_not_configured'
  #
  # So the two scope-wide ceilings — calls and list cost — are all-or-nothing for
  # the whole `google.places.refresh` scope, and each `_UNITS_` ceiling gates one
  # operation on its own. Empty string, a negative number and an unparseable
  # value all read as unset, i.e. as refuse.
  #
  # Consequence worth stating out loud, because the symptom looks like a bug in
  # PR7 rather than a gap here: with none of these set, the refresh job runs,
  # logs nothing unusual, reserves nothing and refreshes nothing. That is a
  # different state from "kill switch off", and scripts/lib/place-refresh-budget.sh
  # is what keeps the two apart at deploy time.
  #
  # No values are proposed here. GoGo-BE's .env.example carries a commented
  # illustration (2000 calls / $5 / 2000 liveness / 200 core / 50 quality) which
  # is an example and not a decision; the real numbers belong to PR7, together
  # with the Places API (New) per-day quota that has to sit slightly above them
  # (INF-015, #15) and the billing alert beside it.
  - path: cost/ledger-enabled
    env_var: COST_LEDGER_ENABLED
    type: String
    required: []
    description: >-
      'true' writes every Google call to provider_usage_daily; 'false' is the GoGo-BE#335
      rollback and makes /cms/ops/costs report sourcesConfigured false. Code defaults to true,
      so an absent parameter means the ledger is on.

  - path: cost/ledger-flush-ms
    env_var: COST_LEDGER_FLUSH_MS
    type: String
    required: []
    description: >-
      How long usage counts may sit in memory before one upsert writes them, 250-60000ms. This
      is the SIGKILL loss window and nothing else. Code defaults to 5000, still unverified —
      ADR-0012 owes the DEV measurement.

  # ── Secure export delivery (GoGo-BE#256, ADR-0033, GoGo-Infra#184) ─────────
  #
  # The export artifact sits in the private bucket under privacy-exports/,
  # encrypted with a per-export data key; that key is wrapped with the version
  # named here. The API and the worker read the same rendered env file, so both
  # see the same keyring. Not `required`: without a key, issuing an export
  # answers 503 — the feature is unavailable, never unencrypted (capability
  # `secure_export` below says where it is meant to run).
  #
  # Rotation is a manifest change, not only an SSM write: render-env.sh renders
  # declared rows only, so V2 needs its own row here before it reaches either
  # process. Keep V1 until every artifact it wrapped is gone (≥48h, ADR-0033).
  - path: privacy-export/wrapping-key-v1
    env_var: EXPORT_WRAPPING_KEY_V1
    type: SecureString
    required: []
    description: >-
      32 random bytes, standard base64 (`openssl rand -base64 32`). GoGo-BE refuses to boot on a
      value that is set but malformed, so a typo fails the deploy rather than the first export.

  - path: privacy-export/wrapping-key-active
    env_var: EXPORT_WRAPPING_KEY_ACTIVE
    type: String
    required: []
    description: >-
      Version number (e.g. 2) that wraps new exports during a rotation. Unset means the highest
      configured version. Naming a version that is not configured fails the boot.

  # ── Cost Center: worker knobs (GoGo-BE#375/#376, INF-060 #114) ──────────────
  #
  # All optional everywhere: GoGo-BE applies its own defaults when a row is
  # absent (estimator on, 15 min; collectors on, 5 min tick; monitoring budget
  # $1/month DEV, $5/month PROD in USD micros). Declared so a change is a
  # parameter and not a deploy of new code.
  - path: cost/estimate-enabled
    env_var: COST_ESTIMATE_ENABLED
    type: String
    required: []
    description: >-
      'false' stops the worker job that re-prices this month's and last month's usage meters
      into provider_cost_daily (basis ESTIMATED). Code defaults to true.

  - path: cost/estimate-poll-ms
    env_var: COST_ESTIMATE_POLL_MS
    type: String
    required: []
    description: >-
      Interval of the estimator recompute, milliseconds. Idempotent and bounded, so it only
      bounds how stale the estimate may be. Code defaults to 900000 (15 min).

  - path: cost/collectors-enabled
    env_var: COST_COLLECTORS_ENABLED
    type: String
    required: []
    description: >-
      'false' stops the collector scheduler tick (freshness rows, paid-collector guardrails,
      cost-of-cost row). Manual-cost materialisation does not answer to it. Code defaults to true.

  - path: cost/collector-poll-ms
    env_var: COST_COLLECTOR_POLL_MS
    type: String
    required: []
    description: >-
      Scheduler tick, milliseconds. Every collector decides for itself whether it is due; the
      tick only asks. Code defaults to 300000 (5 min).

  - path: cost/monitoring-budget-micros
    env_var: COST_MONITORING_BUDGET_MICROS
    type: String
    required: []
    description: >-
      Monthly ceiling, USD micros, on what tracking cost is allowed to cost (epic §20). Above it
      non-essential collectors are paused and marked STALE. Code defaults to 1000000 (DEV) /
      5000000 (PROD).

  # ── Cost Center: provider usage/cost collectors (INF-060 #114) ──────────────
  #
  # Read by the WORKER only, at boot. Every row below is optional in every
  # environment on purpose: a collector whose credentials are absent is not
  # registered, nothing errors, and the provider shows freshness UNKNOWN in the
  # Cost Center — the truthful state. Missing therefore never blocks a deploy,
  # and `render-env.sh` omits the variable so the worker takes the same path a
  # laptop with no token takes.
  #
  # Every credential is READ-ONLY at the provider. None of them can spend or
  # change anything; `docs/accounts.md` §"Cost Center collector credentials"
  # records which token, which scope, when it was created and what running the
  # collector costs. Data-plane credentials (`redis/url`, `database/url`,
  # `r2/*`) are deliberately NOT fallbacks — a different scope, a different
  # blast radius.
  #
  # Cloudflare — GoGo-BE#383, collectors `cloudflare_r2` + `cloudflare_workers`
  # (GraphQL Analytics, no per-query charge). Both rows must be present.
  # PROF-INF-001 (#163), GoGo-BE ADR-0022 — purge-by-URL for a removed avatar.
  # Both or neither. Without them nothing is purged and a removed object keeps
  # answering from the edge for up to its cache lifetime (one day); the API and
  # the worker each say so at boot. Purging reaches the edge only: a device that
  # already fetched the image keeps it until its own cache expires.
  - path: cloudflare/zone-id
    env_var: CF_ZONE_ID
    type: String
    required: []
    description: Zone id of gogo.id.vn — the zone assets-<env>.gogo.id.vn lives in.

  - path: cloudflare/cache-purge-token
    env_var: CF_CACHE_PURGE_TOKEN
    type: SecureString
    required: []
    description: >-
      Cloudflare API token with exactly "Zone → Cache Purge: Purge" on that zone and nothing
      else. Created under My Profile → API Tokens (a REST token, not an R2 credential).

  - path: cloudflare/analytics-token
    env_var: CLOUDFLARE_ANALYTICS_TOKEN
    type: SecureString
    required: []
    description: >-
      Cloudflare API token with exactly "Account Analytics: Read" on the account. Reads the
      r2StorageAdaptiveGroups / r2OperationsAdaptiveGroups / workersInvocationsAdaptive datasets.
      Not the R2 bucket token and not the Terraform token.

  - path: cloudflare/account-id
    env_var: CLOUDFLARE_ACCOUNT_ID
    type: String
    required: []
    description: >-
      Cloudflare account id the analytics token belongs to — the same account as
      config/global.tfvars cloudflare_account_id. Not a secret. Read only by the cost
      collectors; R2 storage does not use it and resolves its account id from r2/endpoint
      instead (GoGo-BE#548). Set this row wherever the analytics token is set.

  - path: cloudflare/r2-buckets
    env_var: CLOUDFLARE_R2_BUCKETS
    type: String
    required: []
    description: >-
      Comma list of R2 bucket names attributed to this environment, e.g.
      gogo-dev-assets,gogo-dev-public (Terraform: <prefix>-assets, <prefix>-public). Absent =
      the rows carry the whole account and say so in metadata.scope.

  - path: cloudflare/worker-scripts
    env_var: CLOUDFLARE_WORKER_SCRIPTS
    type: String
    required: []
    description: >-
      Comma list of Worker script names attributed to this environment, e.g.
      gogo-dev-share-link,gogo-cms-dev (Terraform: <prefix>-share-link and cms_script_name).
      Absent = whole account. Leave the CMS worker in, or its requests vanish from the row.

  # Upstash — GoGo-BE#384, collector `upstash_redis` (Developer API
  # GET /v2/redis/stats/{id}, no per-request charge). All three rows must be present.
  - path: upstash/api-email
    env_var: UPSTASH_API_EMAIL
    type: String
    required: []
    description: >-
      Account email the Developer API key was created under — for a GitHub-OAuth login this is
      the GitHub account's primary email. Basic auth username; not a secret on its own.

  - path: upstash/api-key
    env_var: UPSTASH_API_KEY
    type: SecureString
    required: []
    description: >-
      Upstash Developer (Management) API key. Read-only use — the collector only ever calls the
      stats endpoint. Not REDIS_URL, which is the data-plane credential.

  - path: upstash/database-id
    env_var: UPSTASH_DATABASE_ID
    type: String
    required: []
    description: >-
      The Redis database **id** (UUID from the console), not its name (gogo-dev-redis) or its
      endpoint. A wrong id shows up as NOT_FOUND on the upstash_redis freshness row. One per
      environment.

  # Neon — GoGo-BE#385, collector `neon_postgres` (GET /consumption_history/projects on
  # Launch+, GET /projects/{id} on every plan incl. Free; no charge, wakes no compute).
  # Both rows must be present. INF-008 #8 owns the key's creation.
  - path: neon/api-key
    env_var: NEON_API_KEY
    type: SecureString
    required: []
    description: >-
      Neon API key (personal or organisation). Read-only use: two GETs per run. Not
      DATABASE_URL, which is the data-plane credential and names an endpoint, not a project.

  - path: neon/project-id
    env_var: NEON_PROJECT_ID
    type: String
    required: []
    description: >-
      Neon project **id** (console → Settings → General), not the project name (gogo-dev). One
      per environment.

  # AWS — GoGo-BE#386, collector `aws_cost_explorer` (ACTUAL cost). THE ONE
  # COLLECTOR THAT COSTS MONEY: Cost Explorer is $0.01 per GetCostAndUsage
  # request; the scheduler caps it at 1/day (~$0.30/month). It never falls back
  # to the ambient AWS identity — a dedicated IAM user whose entire policy is
  # `ce:GetCostAndUsage` on `*`, so both the spend and the blast radius are
  # deliberate. Cost Explorer must be enabled on the account first (24h lag)
  # or the freshness row reads ACCESS_DENIED.
  - path: aws/cost-explorer-access-key-id
    env_var: AWS_COST_EXPLORER_ACCESS_KEY_ID
    type: SecureString
    required: []
    description: >-
      Access key id of the dedicated Cost Explorer IAM user (policy: ce:GetCostAndUsage only).
      Never the bootstrap profile and never a CI OIDC role.

  - path: aws/cost-explorer-secret-access-key
    env_var: AWS_COST_EXPLORER_SECRET_ACCESS_KEY
    type: SecureString
    required: []
    description: Secret of the same key pair. Rotate both together.

  # GitHub — GoGo-BE#386, collector `github_actions` (enhanced billing platform
  # GET /users/{account}/settings/billing/usage — the old /settings/billing/actions
  # endpoint was shut down 2025-09-26). Both rows must be present.
  - path: github/billing-token
    env_var: GITHUB_BILLING_TOKEN
    type: SecureString
    required: []
    description: >-
      Fine-grained personal access token with the account permission "Plan: read" only — no
      repository scope. 403 on the freshness row = missing permission; 404 = wrong login or an
      account not on the enhanced billing platform.

  - path: github/billing-account
    env_var: GITHUB_BILLING_ACCOUNT
    type: String
    required: []
    description: >-
      The account login whose bill is read — config/global.tfvars github_owner, a user account.
      GoGo-BE falls back to GITHUB_OWNER when absent; GITHUB_BILLING_ACCOUNT_KIND is not
      declared because the default (user) is right until the repos move under an org.

  # Sentry — GoGo-BE#696 (BE#389 G-22), collector `sentry_events`: org Stats API
  # GET /api/0/organizations/{org}/stats_v2/ (category=error). Sentry is one org for every
  # environment, so only one environment holds these rows (dev today) — a second env would
  # count the same events twice. Shape: sa-shape-sentry-cost-center.fable.md D-5.
  - path: sentry/stats-token
    env_var: SENTRY_STATS_TOKEN
    type: SecureString
    required: []
    description: >-
      Token of the Sentry internal integration `gogo-cost-collector` (org gogo-vn), permission
      Organization: Read only — no project permission, no webhook. 403 on the freshness row =
      missing permission. Rotate: generate a new token on the integration, put.sh it, deploy,
      then revoke the old token. Kill switch: revoke the token (collector goes STALE) or delete
      this row and deploy (collector not registered).

  - path: sentry/org
    env_var: SENTRY_ORG
    type: String
    required: []
    description: >-
      Sentry organization slug (`gogo-vn`). GoGo-BE defaults to the same value when absent.

  # OpenRouter — GoGo-BE#709, collector `openrouter_activity`: GET /api/v1/keys and
  # GET /api/v1/activity?api_key_hash=… (management API). One OpenRouter account serves every
  # environment, so only one environment holds this row (dev) — a second env would count the
  # same spend twice. Spend is split by key name (- or _): gogo_ai_harness_dev (harness),
  # gogo-claude-dev (Claude via BYOK; the Claude charge is written for provider anthropic),
  # gogo_be_<env> (BE POC, not created yet), gogo_jev_<env> (shared, unsplit),
  # gogo_ai_anthropic_<env> (the GoGo AI assistant, Claude via BYOK — ADR-0014 D-7; DEV key
  # gogo_ai_anthropic_dev exists). GoGo-BE's openRouterServiceFor() does not know this family
  # yet: until it does, the assistant's spend lands in openrouter.other_keys (dependency on BE).
  - path: openrouter/management-key
    env_var: OPENROUTER_MANAGEMENT_KEY
    type: SecureString
    required: []
    description: >-
      OpenRouter management key (Settings → Management keys), read-only use: GoGo-BE calls only
      /keys and /activity, never key create/delete. Not the inference key — a runtime or harness
      key answers 403 (FORBIDDEN on the freshness row). Rotate: create a new management key,
      put.sh it, deploy, then delete the old one. Kill switch: delete the key in OpenRouter
      (collector goes STALE) or delete this row and deploy (collector not registered).

  # GoGo-BE#709 — the BE intent POC's own JEV key (OpenRouter key named gogo_be_<env>, filed by
  # the Cost Center as openrouter.decisions). Separate from ci:ai-harness/openrouter-api-key
  # (ADR-0013 D-11): its own credit limit, its own spend line. Nothing in GoGo-BE reads it at
  # runtime yet — IntentClassificationService is disabled by default and not routed — so today
  # its one reader is `pnpm eval:intent`, run through exec-with.sh with
  # INTENT_EVAL_LIVE_AUTHORIZED=yes and the eval's own spend cap.
  # consumer: seed (PR #242 A-F-07) — one command loads it and nothing else does, so render-env.sh
  # and pull.sh never export it to the API or worker; exec-with.sh, validate.sh and put.sh still
  # see it. Moving it to runtime is the contract change BE runtime integration has to make, with
  # its own approval.
  - path: openrouter/api-key
    env_var: OPENROUTER_API_KEY
    consumer: seed
    type: SecureString
    required: []
    description: >-
      OpenRouter inference key named gogo_be_<env>, with a key-level credit limit set at
      creation (the provider-side cap; the eval's INTENT_EVAL_MAX_USD is a second, local one).
      Decisions API only. Rotate: create a new key with the same name, put.sh it, then delete
      the old key in OpenRouter. Kill switch: disable the key in OpenRouter (402/401 → every
      classification falls back to the deterministic parser).

  # ── GoGo AI assistant (GoGo-Infra#257, ADR-0014; epic GoGo-MobileApp#377) ──
  #
  # The in-app chat assistant served by GoGo-BE#713 (/v1/assistant/*): Claude through
  # OpenRouter. Its own OpenRouter key (named gogo_ai_anthropic_<env>, Anthropic BYOK), its
  # own credit limit, its own spend line in the Cost Center — never openrouter/api-key (the
  # decisions POC) and never ci:ai-harness/openrouter-api-key (ADR-0013 D-7/D-11).
  #
  # consumer: runtime (the default), unlike openrouter/api-key: the API serves the assistant,
  # so render-env.sh and pull.sh hand these to it. Nothing in GoGo-BE reads them yet, so none
  # is required anywhere; absent, the assistant answers "unavailable" and nothing else breaks
  # (ADR-0014 D-6). Each becomes required in an environment on the day the assistant is on
  # there — the google/maps-ios-api-key rule. Capability ai_assistant below lists the set
  # readiness checks.
  - path: openrouter/assistant-api-key
    env_var: OPENROUTER_ASSISTANT_API_KEY
    type: SecureString
    required: []
    description: >-
      OpenRouter inference key named gogo_ai_anthropic_<env> (DEV: gogo_ai_anthropic_dev,
      created by the owner; stag/prod created when those environments are), the GoGo AI
      assistant only. Key-level credit limit with a monthly reset set on the key (ADR-0014
      D-4); Anthropic BYOK, so the Anthropic workspace spend limit is the cap on the Claude
      charge itself. Rotate: create a new key with the same name and limit, put.sh it,
      deploy, then delete the old key in OpenRouter. Kill switch: flags/assistant /
      the audited FEATURE_FLAGS row (no deploy); hard stop: disable the key in OpenRouter
      (401/402 → the assistant answers unavailable, nothing else is affected).

  - path: assistant/model
    env_var: ASSISTANT_MODEL
    type: String
    required: []
    description: >-
      OpenRouter model id the assistant answers with, e.g. anthropic/claude-sonnet-5.5
      (ADR-0014 D-1, owner picks). A spend decision, so it lives here and not as a code
      default: changing it is put.sh + deploy, visible in the SSM history.

  - path: assistant/fallback-model
    env_var: ASSISTANT_FALLBACK_MODEL
    type: String
    required: []
    description: >-
      OpenRouter model id used when the primary errors, times out or is overloaded, e.g.
      anthropic/claude-haiku-5.5 (ADR-0014 D-2). Never more expensive than assistant/model.
      Absent = no fallback: the request fails over to the "unavailable" answer.

  - path: budget/assistant-monthly-max-usd
    env_var: ASSISTANT_MONTHLY_MAX_USD
    type: String
    required: []
    description: >-
      Monthly assistant spend ceiling in USD for this environment (ADR-0014 D-4) — the same
      figure as the credit limit on the OpenRouter key. GoGo-BE refuses new assistant turns
      at 100 % of it and exports it as ai_assistant_budget_month_usd, the denominator of the
      80 % alert. Unset = the assistant refuses (default-deny, the place-refresh budget rule).

  - path: budget/assistant-user-daily-max-messages
    env_var: ASSISTANT_USER_DAILY_MAX_MESSAGES
    type: String
    required: []
    description: >-
      Messages one signed-in account may send the assistant per UTC day (ADR-0014 D-5;
      proposed 30). Enforced by GoGo-BE; guests never reach it (401/403). Unset = the
      assistant refuses, never unlimited.

  - path: flags/assistant
    env_var: FLAG_ASSISTANT
    type: String
    required: []
    description: >-
      Deploy-time default for the assistant.enabled kill switch (ADR-0014 D-6). The
      authoritative switch is the environment-scoped FEATURE_FLAGS row audited through the
      CMS; this only seeds it. Off answers "unavailable" without calling OpenRouter — a
      different state from an unset budget, which refuses.

  - path: budget/place-refresh-daily-max-calls
    env_var: PLACE_REFRESH_DAILY_MAX_CALLS
    type: String
    required: []
    description: >-
      Absolute Google calls per day for scope google.places.refresh. Unset REFUSES every
      reservation in the scope, including operations whose own unit ceiling is set.

  - path: budget/place-refresh-daily-max-list-cost-usd
    env_var: PLACE_REFRESH_DAILY_MAX_LIST_COST_USD
    type: String
    required: []
    description: >-
      Worst-case daily spend ceiling for the scope in USD at list price, no free-tier or volume
      deduction. Converted to micros by GoGo-BE. Unset REFUSES the whole scope, same as the call
      ceiling.

  - path: budget/place-refresh-daily-max-units-google-details-liveness
    env_var: PLACE_REFRESH_DAILY_MAX_UNITS_GOOGLE_DETAILS_LIVENESS
    type: String
    required: []
    description: >-
      Daily unit ceiling for the google.details.liveness operation (Details Essentials IDs-Only,
      $0/1k). PR7 phase 1 uses only this operation, so unset means phase 1 refreshes nothing.

  - path: budget/place-refresh-daily-max-units-google-details-core
    env_var: PLACE_REFRESH_DAILY_MAX_UNITS_GOOGLE_DETAILS_CORE
    type: String
    required: []
    description: >-
      Daily unit ceiling for google.details.core (Details Pro, $17/1k). First consumed by PR8
      phase 2, which is itself gated on the ADR-0006 §9.6 signatures.

  - path: budget/place-refresh-daily-max-units-google-details-quality
    env_var: PLACE_REFRESH_DAILY_MAX_UNITS_GOOGLE_DETAILS_QUALITY
    type: String
    required: []
    description: >-
      Daily unit ceiling for google.details.quality (Details Enterprise, $20/1k). Same gate as
      core, and the more expensive of the two — set it deliberately, not by symmetry.

  # ── Places: refresh job, kill switch, resolution attestation ────────────────
  #
  # INF-057, for GoGo-BE#337 (PR4) and GoGo-BE#340 (PR7).
  #
  # The two `places/resolution-*` names below **are** read by GoGo-BE as of PR4
  # (GoGo-BE#337, merged to that repo's develop 2026-09-02); the two refresh
  # names still wait on PR7. All four stay optional everywhere regardless, and
  # that is deliberate rather than an oversight: an absent optional is omitted
  # from the rendered env file, so the application's own default applies. For the
  # attestation that means an empty secret, which makes the feature *unavailable*
  # rather than open — the backend simply pays for the Google call it always paid
  # for, and says so through
  # `place_resolution_attestation_total{result="unconfigured"}`.
  #
  # Each becomes required in an environment on the day its value lands there,
  # which is the rule google/maps-ios-api-key already follows. Declared ahead of
  # the code because the alternative is discovering the parameter at deploy time.
  - path: worker/place-refresh-poll-ms
    env_var: PLACE_REFRESH_POLL_MS
    type: String
    required: []
    description: >-
      Interval of the gogo:worker:place-refresh scheduler in ms. Plan §2.5 sets DEV to 900000
      (15 minutes) for the same Upstash per-command reason as the outbox and ingest intervals.

  - path: flags/place-refresh
    env_var: FLAG_PLACE_REFRESH
    type: String
    required: []
    description: >-
      Deploy-time default for the place_refresh.enabled kill switch. The authoritative switch is
      the environment-scoped FEATURE_FLAGS row audited through the CMS; this only seeds it. Off
      is a different state from an unconfigured budget, which refuses silently.

  - path: places/resolution-attestation-secret
    env_var: PLACE_RESOLUTION_ATTESTATION_SECRET
    type: SecureString
    required: []
    description: >-
      HMAC-SHA256 key signing the short-lived resolve attestation POST /v1/place-submissions
      accepts in place of a second Google Details fetch (plan §2.8). Ours to generate, never
      collected from a provider; server-side only, never rendered into a CMS or mobile build.

  - path: places/resolution-ttl-s
    env_var: PLACE_RESOLUTION_TTL_S
    type: String
    required: []
    description: >-
      Lifetime of that attestation in seconds, default 600. It is a capability window: longer
      widens the replay window, shorter makes a slow user re-resolve and pay for another call.

  # Poll intervals for the BullMQ schedulers, in milliseconds. Not secret, and
  # optional everywhere — the application defaults to 5000.
  #
  # DEV sets these higher because Upstash bills per command: two schedulers at
  # 5s exceed the free tier before any job exists (INF-009). Production leaves
  # them unset and keeps the default.
  - path: worker/outbox-poll-ms
    env_var: OUTBOX_POLL_MS
    type: String
    required: [dev, staging, prod]
    description: >-
      Outbox relay poll interval in ms — how often the worker asks Postgres for unpublished
      events, and therefore the ceiling on notification latency. No Redis is involved since
      GoGo-BE#262. Required so every environment states its latency rather than inheriting the
      5000ms default by accident.

  - path: worker/ingest-poll-ms
    env_var: INGEST_POLL_MS
    type: String
    required: [dev, staging, prod]
    description: >-
      Place-ingest poll interval in ms — how often the worker asks Postgres for import chunks an
      admin has started. Same reasoning as the outbox interval.

  # Ingress configuration. Not secret, and not optional: the compose stack fails
  # to start without them (`DOMAIN: ${DOMAIN:?set DOMAIN}`), so a deploy that
  # omits them dies at the first container rather than at a check.
  #
  # Named for the role, not the tool. Caddy terminates TLS today; the contract is
  # "the hostname this environment answers on" and survives replacing it.
  - path: ingress/domain
    env_var: DOMAIN
    type: String
    required: [dev, prod]
    description: Hostname the environment serves the API on, e.g. api-dev.gogo.id.vn. Drives the TLS certificate, so it must match the DNS record.

  - path: ingress/acme-email
    env_var: ACME_EMAIL
    type: String
    required: [dev, prod]
    description: Contact address Let's Encrypt uses for expiry and revocation notices. Not a credential; kept in SSM rather than committed because it is a personal address.

  # The connector's credential. Only environments whose host has no inbound
  # connectivity need it, which today is dev — production gets a host with open
  # ports, and an unused connector token there would be a credential guarding
  # nothing.
  - path: tunnel/token
    env_var: TUNNEL_TOKEN
    type: SecureString
    required: [dev]
    description: Cloudflare tunnel connector token. Enough on its own to run a connector for the tunnel, so it is written from terraform output straight into SSM and never printed.

  - path: observability/sentry-dsn
    env_var: SENTRY_DSN
    type: String
    required: [prod]
    description: Sentry DSN for the api and worker processes. Config, not a credential — it ships in clients anyway. The release upload token is a separate CI credential.

  # The scrape credential. GoGo-BE answers /v1/metrics with 404 rather than 401
  # when this is empty, so a missing parameter does not fail a deploy or leak
  # the endpoint's existence — it just silently publishes nothing, which is how
  # dev ran with provider metrics no one could read (INF-053).
  #
  # Server-to-server only. It never reaches a browser, a CMS bundle or any
  # EXPO_PUBLIC_/VITE_ variable: the series names and label values describe
  # which providers get called and which admin actions happen.
  #
  # dev only for now. staging and prod get theirs at their own bootstrap.
  - path: observability/metrics-token
    env_var: METRICS_TOKEN
    type: SecureString
    required: [dev]
    description: Bearer token a monitoring collector presents to GET /v1/metrics. Grants read of every internal series, so it is a credential, not config.

  # Grafana Cloud parameters retired 2026-09-05 (ADR-0007 §E1/§E7). The DEV
  # store is the self-hosted Prometheus above. The Cloud metrics:write and
  # metrics:read tokens were revoked at the provider first; then the five SSM
  # parameters (grafana-prom-url, grafana-prom-user, grafana-write-token,
  # grafana-read-token, grafana-retention-days) were deleted and their entries
  # removed here in the same change — validate.sh fails on MISSING and on
  # UNDECLARED alike, so neither half may land alone. Rotation register:
  # docs/secrets.md. `grafana-url` below is unrelated: the self-hosted
  # Grafana link.
  # ADR-0007 (INF-064) moved the DEV store onto 192.168.68.168. These four are
  # what make that reachable from the deploy: `render-env.sh` renders strictly
  # what this manifest lists, so a variable absent here never reaches the host
  # no matter what is in SSM, and the collector would keep writing to Grafana
  # Cloud with nothing in the logs to say why.
  #
  # `required: [dev]` since 2026-09-05: the DEV cutover passed its shared
  # end-to-end gate (deploy-dev through Cloudflare Access, api/worker series
  # current at 192.168.68.168, authenticated CMS monitoring populated from it,
  # LAN isolation verified off-host). An empty value now means metrics are
  # collected nowhere and nothing about the running system looks different —
  # INF-053 verbatim — so the deploy must refuse. `metrics-query-url` and
  # `grafana-url` below stay optional: the first is the one route to the §E7
  # split-brain, the second is a bookmark.
  - path: observability/prometheus-remote-write-url
    env_var: PROMETHEUS_REMOTE_WRITE_URL
    type: String
    required: [dev]
    description: Remote-write endpoint of the self-hosted Prometheus, e.g. http://192.168.68.168:9090/api/v1/write. Config, not a credential — it names the store and grants nothing. Its presence is also what adds the collector overlay to the deploy.

  # One credential, not the two the Grafana Cloud path uses. Prometheus' own
  # basic auth has no per-user authorization: every admitted user can read and
  # write, so a separate read token would be a name for the same access rather
  # than a smaller one. Recorded as a deliberate DEV difference under ADR-0007
  # §E8 — the mitigation is that :9090 admits exactly one source address
  # (INF-066's firewall), and the question is reopened when PROD topology is
  # decided (ADR-0006 §D4).
  # The query endpoint, separate from the write endpoint because they are two
  # facts that can legitimately differ — a read replica, a proxy, or simply a
  # base URL whose path convention is not the write path's. Empty means "read
  # where the collector writes", which is the ordinary case and the one §E7
  # makes safe.
  #
  # Held in SSM rather than in an image or a compose file so the store can be
  # repointed without a rebuild: `render-env.sh` re-renders on the next deploy
  # and the API picks it up on restart. That is the property ADR-0006 called
  # the low reversal cost — moving the samples is a URL and a credential.
  - path: observability/metrics-query-url
    env_var: METRICS_QUERY_URL
    type: String
    required: []
    description: Prometheus query endpoint, when it differs from the remote-write one. Empty means read from wherever the collector writes. Config, not a credential.

  # Where a human goes to look at a graph. Nothing reads a series from it — the
  # API queries Prometheus directly (ADR-0013 §D1) — so this is a link, not a
  # dependency. In SSM because the host it names is DEV infrastructure that can
  # move, and a base URL pasted into a dashboard or a runbook is the thing that
  # goes stale silently.
  - path: observability/grafana-url
    env_var: GRAFANA_URL
    type: String
    required: []
    description: Base URL of the self-hosted Grafana, e.g. http://192.168.68.168:3000. A link for operators; no service reads samples through it.

  - path: observability/prometheus-basic-auth-user
    env_var: PROMETHEUS_BASIC_AUTH_USER
    type: String
    required: [dev]
    description: Basic-auth username the collector and the API present to the self-hosted Prometheus. Useless without the password.

  - path: observability/prometheus-basic-auth-password
    env_var: PROMETHEUS_BASIC_AUTH_PASSWORD
    type: SecureString
    required: [dev]
    description: Basic-auth password for the self-hosted Prometheus. Grants read and write on that store — Prometheus basic auth cannot scope one without the other.

  # ADR-0009 / INF-156. The Telegram receiver Grafana's administrative-data
  # alerts notify through.
  #
  # `consumer: observability` is the load-bearing field, and it follows INF-069's
  # precedent exactly. `backend` is the right namespace — same IAM, same deploy
  # and monitor roles that already read the five parameters above, so no
  # Terraform change and no secret in Terraform state. But render-env.sh asks the
  # manifest for `--consumer runtime`, so neither of these is ever rendered into
  # the API's env file. A bot token for a chat anyone in it can read has no
  # business in the process environment of the most internet-exposed service
  # here, for the benefit of a container on a different machine.
  #
  # They reach Grafana on 192.168.68.168 through
  # observability/local-grafana/bin/render-alerting-env.sh, which writes a
  # mode-0600 .env.alerting that compose loads into the Grafana container alone.
  #
  # `required: []` deliberately. A deploy must not fail because DEV alerting has
  # not been set up yet; what fails loudly is Grafana provisioning, at the moment
  # someone actually tries to run the alerts without a credential.
  - path: observability/grafana-telegram-bot-token
    env_var: GRAFANA_TELEGRAM_BOT_TOKEN
    type: SecureString
    required: []
    consumer: observability
    description: Telegram bot token Grafana presents when sending administrative-data alerts. A credential — it can post to every chat the bot is in. Created by the owner, never generated by CI.

  # SecureString for operational consistency with the token rather than because
  # a chat id is a secret on its own. It is still worth not publishing: it names
  # the channel an attacker would want to flood or read.
  - path: observability/grafana-telegram-chat-id
    env_var: GRAFANA_TELEGRAM_CHAT_ID
    type: SecureString
    required: []
    consumer: observability
    description: Telegram chat id the administrative-data alerts are delivered to. Stored encrypted alongside the token so the pair rotates together.

  - path: observability/metrics-retention-days
    env_var: METRICS_RETENTION_DAYS
    type: String
    required: [dev]
    description: How much history the store actually holds, so the CMS console offers a window it can answer. Must match PROMETHEUS_RETENTION_TIME on the observability host; the 14-day fallback is Grafana Cloud Free's and is wrong for the self-hosted store.

  # Not a credential and not in SSM today: GoGo-BE defaults it to 14, which is
  # what Grafana Cloud Free keeps, and the ops API answers a 30-day request
  # with 14 days and `truncated: true` rather than extrapolating the rest
  # (GoGo-BE#315). Declared so raising it is a parameter and not a deploy of
  # new code — production on Pro keeps 13 months.
  # ADR-0007. Off means every itinerary leg is the straight-line estimate —
  # which is also the permanent fallback for quota exhaustion and outages, so
  # turning this on adds real travel times without removing that safety net.
  #
  # Not a credential, and not a secret: it is the one bit that says whether
  # GoGo pays Google for travel time. Kept here rather than defaulted in code
  # because it is a spend decision, and a spend decision should be visible in
  # the same place as every other environment fact.
  #
  # Google Routes bills per *element* (origins × destinations), not per call,
  # so the cost scales with itinerary size. `places_provider_cost_units`
  # already counts elements rather than requests for exactly this reason.
  - path: flags/routes-api
    env_var: FLAG_ROUTES_API
    type: String
    required: []
    description: "'true' enables the Google Routes adapter for travel time. Off falls back to straight-line estimates, which is also the outage fallback."


  # ── namespace: mobile ───────────────────────────────────────────────────────
  #
  # GoGo's first client credential. Everything above this line is a server-side
  # value that never leaves a host we control; this one ships inside a published
  # app binary, and anyone with the .ipa can read it. That is not a mistake to be
  # fixed — the Maps SDK runs on the device, so the device must hold the key.
  #
  # The protection model is therefore different in kind, not in degree:
  #
  #   server key   secret. Leaking it is the incident. Rotate on exposure.
  #   client key   public by construction. The *restriction* is the control —
  #                a key restricted to `Maps SDK for iOS` and to our bundle ids
  #                is useless to a caller who is not our signed app, so an
  #                extracted key buys an attacker nothing but our quota.
  #
  # Two things follow, and both are why this is not just another row in
  # `google/`. It must never be rendered into a server env file (render-env.sh
  # reads the `backend` namespace only), and a leak is answered by tightening
  # the restriction and watching the quota, not by treating the binary as
  # compromised. It is still SecureString in SSM: public in a shipped app is not
  # the same as public in a parameter store an offboarded operator can list.
  #
  # Not in the offboarding rotation list for the same reason — a departing
  # developer already had it the moment they built the app once.
  #
  # required: [dev] since 02/09/2026, when the key was created and the value
  # landed. Optional for exactly as long as it did not exist — the same rule the
  # Grafana parameters follow, and for the same reason INF-053 exists: once a
  # value is real, a missing one has to break something visible rather than ship
  # a build that silently draws the wrong map.
  #
  # This does not gate a deploy. `deploy-dev.yml` runs validate.sh under the
  # deploy role, which holds `<env>/backend/*` only and therefore reports the
  # mobile namespace as SKIPPED, not MISSING. That is the intended split: the
  # API has no business reading a build key. The check that bites is a developer
  # session, which is also the only place a mobile build happens today.
  - path: google/maps-ios-api-key
    namespace: mobile
    env_var: GOOGLE_MAPS_IOS_API_KEY
    type: SecureString
    required: [dev]
    description: >-
      Client key for Maps SDK for iOS (APP-040, ADR 0005). Ships in the binary; protected by an
      iOS-app restriction on bundle ids max.gogo.{dev,stag,prod} and an API restriction to that
      one SDK. Read once at `expo prebuild`, never by JavaScript and never by GoGo-BE. Absent,
      react-native-maps falls back to Apple Maps and the build still runs.

  # Symmetric with the iOS key above, with one difference that matters
  # operationally: Android's application restriction is package name **plus the
  # signing certificate SHA-1**, so it is per signing key, not just per package.
  # A build signed with a debug keystore and a build signed with the release
  # keystore are two different callers to Google even at the same package name.
  #
  # That means every machine and every signing path that builds the app has to
  # have its SHA-1 registered, and a restriction that looks correct will refuse
  # a colleague's debug build. The symptom is a grey grid with the Google logo
  # and an "Authorization failure" line in logcat naming the package and the
  # fingerprint to add — the failure is legible, but only if someone knows to
  # read logcat rather than assume the key is wrong.
  #
  # required: [dev] since 02/09/2026, same rule as the iOS key above.
  #
  # Worth stating what this does NOT assert. The restriction probe in
  # check-provider-keys.sh confirms this key's API restriction — Places refuses
  # it — but Android's API restriction short-circuits, so no HTTP call can reach
  # the app restriction behind it. `required` here means the value exists, not
  # that package + SHA-1 are set. That one is confirmed in the console, and it
  # is the restriction that stops an extracted key being used by any app.
  - path: google/maps-android-api-key
    namespace: mobile
    env_var: GOOGLE_MAPS_ANDROID_API_KEY
    type: SecureString
    required: [dev]
    description: >-
      Client key for Maps SDK for Android (APP-041). Ships in the binary; protected by an
      Android-app restriction on packages max.gogo.{dev,stag,prod} paired with each signing
      certificate's SHA-1 — debug keystore, each environment's signing/android-keystore
      (GoGo-Infra#271), and Play's app signing key for prod — recorded in docs/accounts.md
      §App identity; and an API restriction to that one SDK. Read at prebuild, never by
      JavaScript and never by GoGo-BE. Absent, the map falls back to the platform default.

  # GoGo-Infra#208, ADR-0011. The app's crash and error reporting target. Unlike
  # the two keys above it is read by JavaScript (EXPO_PUBLIC_*), because the
  # Sentry SDK initialises in JS; it is config, not a credential — a DSN can only
  # submit events to one project, which is why it is a `String`, the one
  # exception to "the mobile branch is SecureString" (docs/secrets.md).
  #
  # Rendered by scripts/secrets/mobile-env.py, which accepts a DSN or the literal
  # `off`. Absent: a dev build gets an empty value (reporting off, warned on
  # stderr); a staging or production build is refused — so is it in
  # GoGo-MobileApp's app.config.ts. Disabling on purpose means writing `off`.
  - path: sentry/dsn
    namespace: mobile
    env_var: EXPO_PUBLIC_SENTRY_DSN
    type: String
    required: [dev]
    description: >-
      Sentry DSN for the app, project gogo-vn/gogo-mobile (id 4512252504178688). Ships in the
      binary; a DSN or the literal off. Kill switches: disable the client key in Sentry (stops
      storage), or rebuild with off (stops transmission).

  # GoGo-Infra#237, GoGo-MobileApp#363 (MMP-001). Adjust runs as the app's second
  # MMP, beside Tenjin (owner 2026-10-19). Each app in the Adjust dashboard has
  # one *app token*; the SDK sends it with every package, so it ships in the
  # binary and is config, not a credential — in kind the Maps client keys above,
  # and SecureString for the same reason they are.
  #
  # Rendered by scripts/secrets/mobile-env.py as ADJUST_<PLATFORM>_APP_TOKEN plus
  # ADJUST_CONFIG_ENV. Absent: a dev build gets an empty value (Adjust off,
  # warned on stderr); staging or production refuses — a store build cannot lose
  # its MMP by omission. Disabling on purpose means writing `off`. The SDK's
  # environment (sandbox / production) is not configured here: GoGo-MobileApp
  # derives it from the flavour in code (prod → production, else sandbox).
  #
  # What Adjust has that is NOT here, on purpose:
  #
  #   event tokens   per event, from the dashboard. Not secrets and not SSM: when
  #                  the app sends events (not phase 1), they live in the app's
  #                  code as named constants per flavour (shape D4).
  #   API / Report token, S2S security token
  #                  real credentials, GoGo-BE calls neither. If it ever does:
  #                  `backend/adjust/api-token`, `backend/adjust/s2s-token` —
  #                  never in `mobile`. Do not mint one so that a checklist turns
  #                  green; add its row when a caller exists.
  #
  # required: [dev] from the first write (GoGo-Infra#237 AC-C4) — the owner has
  # the DEV tokens. Same deploy split as the Maps keys: the deploy role reads
  # `backend/*` only and reports this as SKIPPED; the developer session is the
  # check that bites, and the only place a mobile build happens today.
  - path: adjust/ios-app-token
    namespace: mobile
    env_var: ADJUST_IOS_APP_TOKEN
    type: SecureString
    required: [dev]
    description: >-
      Adjust app token for this environment's iOS app (max.gogo.<flavor>). Ships in the binary;
      8-32 letters and digits, or the literal off. Read at build by mobile-env.py, never by
      GoGo-BE. Kill switch: rebuild with off, or pause the app in the Adjust dashboard.

  - path: adjust/android-app-token
    namespace: mobile
    env_var: ADJUST_ANDROID_APP_TOKEN
    type: SecureString
    required: [dev]
    description: >-
      Adjust app token for this environment's Android app (max.gogo.<flavor>). Ships in the binary;
      8-32 letters and digits, or the literal off. Read at build by mobile-env.py, never by GoGo-BE.
      Kill switch: rebuild with off, or pause the app in the Adjust dashboard.


  # ── namespace: ci ───────────────────────────────────────────────────────────
  #
  # INF-171. Pipeline credentials, under `/gogo/ci/<env>/…` rather than
  # `/gogo/<env>/ci/…`. The prefix is what the IAM policies are written against
  # and what the plan/apply role split is expressed in, so the tree shape is not
  # cosmetic.
  #
  # These are declared here for one reason: until they were, eleven credentials
  # existed in SSM that no manifest mentioned, no validation checked and no
  # rotation covered — and the only way to find out what any of them was for was
  # to read every workflow. `validate.sh` reported them nowhere because it only
  # looked at namespaces the manifest knew about.
  #
  # They are never rendered into a runtime environment. `render-env.sh` asks for
  # `--namespace backend --consumer runtime` and `mobile-env.py` for
  # `--namespace mobile`; neither can reach a `ci` row, and
  # manifest.test.sh pins that. A pipeline credential in the API's
  # /proc/self/environ would hand an internet-facing process the ability to
  # deploy itself.
  #
  # `scope` is a human-readable statement of least privilege, not something the
  # validator can confirm. Metadata validation proves a parameter exists and has
  # the declared type; only `scripts/ops/check-cf-token-scopes.sh` (Cloudflare)
  # and `scripts/ops/check-provider-keys.sh` (Google) ask a provider what a
  # credential may actually do. Never claim a scope is verified because it is
  # written here.

  - path: cms-deploy/cloudflare-token
    namespace: ci
    env_var: CLOUDFLARE_API_TOKEN
    consumer: pipeline
    type: SecureString
    required: []
    provider: cloudflare
    credential_class: api_token
    used_by: GoGo-Infra/.github/workflows/deploy-cms-dev.yml
    purpose: >-
      Uploads and promotes the CMS Worker — `wrangler versions upload` then
      `wrangler versions deploy <id>@100%`.
    scope: >-
      Account · Workers Scripts:Edit, restricted to the `gogo-cms-dev` script. Needs no R2,
      no DNS and no Access. Verified 10/09/2026: this token answers 403 on
      `/accounts/{id}/r2/buckets`, which is the shape it should keep.
    provision: Cloudflare dashboard → Manage Account API Tokens → Create Token → Workers Scripts:Edit.
    description: >-
      Exported as CLOUDFLARE_API_TOKEN for the wrangler steps only. Distinct from an R2 S3
      credential: this is a Bearer management token and cannot sign an S3 request.

  - path: cms-deploy/github-read-token
    namespace: ci
    consumer: pipeline
    type: SecureString
    required: []
    provider: github
    credential_class: api_token
    used_by: GoGo-Infra/.github/workflows/deploy-cms-dev.yml
    purpose: Checks out GoGo-CMS at the requested ref; the repository is private.
    scope: Contents:Read on GoGo-CMS only. No write, no other repository, no org administration.
    provision: GitHub → fine-grained PAT scoped to the GoGo-CMS repository.
    description: Consumed by actions/checkout in the CMS deploy job. Never reaches a runtime host.

  - path: deploy/ssh-private-key
    namespace: ci
    consumer: pipeline
    type: SecureString
    required: []
    provider: self
    credential_class: ssh_key
    used_by: GoGo-Infra/.github/workflows/deploy-dev.yml
    purpose: Authenticates the deploy job to the dev VPS over the Cloudflare Access tunnel.
    scope: The deploy user on the dev VPS. Paired with the Access service token below — neither alone reaches the host.
    pair_with: deploy/access-client-id, deploy/access-client-secret
    provision: Generated locally, public half installed in the VPS deploy user's authorized_keys.
    description: Written to a temp file by the job and shredded in the final step.

  - path: deploy/access-client-id
    namespace: ci
    env_var: TUNNEL_SERVICE_TOKEN_ID
    consumer: pipeline
    type: String
    required: []
    provider: cloudflare
    credential_class: oauth_client
    used_by: GoGo-Infra/.github/workflows/deploy-dev.yml
    purpose: Cloudflare Access service token so the SSH tunnel is allowed through the Access policy.
    scope: The Access application in front of ssh-dev only.
    pair_with: deploy/access-client-secret
    provision: Cloudflare Zero Trust → Access → Service Auth → create a service token.
    description: >-
      Exported as TUNNEL_SERVICE_TOKEN_ID. String, not SecureString — the client id is the
      non-secret half of the pair and is matched by the secret below.

  - path: deploy/access-client-secret
    namespace: ci
    env_var: TUNNEL_SERVICE_TOKEN_SECRET
    consumer: pipeline
    type: SecureString
    required: []
    provider: cloudflare
    credential_class: oauth_client
    used_by: GoGo-Infra/.github/workflows/deploy-dev.yml
    purpose: Secret half of the Access service token.
    scope: The Access application in front of ssh-dev only.
    pair_with: deploy/access-client-id
    provision: Shown once when the service token is created; not retrievable afterwards.
    description: Exported as TUNNEL_SERVICE_TOKEN_SECRET and masked in the job log.

  # Terraform's plan/apply split is a privilege boundary, not a convention. The
  # read token refreshes state on pull requests, which run untrusted code from a
  # fork's branch; the write token is only ever loaded by the apply job on
  # `develop`. Two tokens, two IAM roles, two SSM subtrees.
  - path: terraform/read/cloudflare-token
    namespace: ci
    env_var: CLOUDFLARE_API_TOKEN
    consumer: pipeline
    type: SecureString
    required: []
    provider: cloudflare
    credential_class: api_token
    used_by: GoGo-Infra/.github/actions/tf-setup (stage read) → terraform-plan-dev.yml
    purpose: Refreshes every Cloudflare resource Terraform manages, so a plan is accurate.
    scope: >-
      Account read across R2, Workers, DNS and Access, plus Zone read. Read-only: it must not
      be able to change anything a pull request planned. Confirm with
      scripts/ops/check-cf-token-scopes.sh dev.
    provision: Cloudflare dashboard → Manage Account API Tokens, read permissions only.
    description: Exported as CLOUDFLARE_API_TOKEN for `terraform plan` only.

  - path: terraform/write/cloudflare-token
    namespace: ci
    env_var: CLOUDFLARE_API_TOKEN
    consumer: pipeline
    type: SecureString
    required: []
    provider: cloudflare
    credential_class: api_token
    used_by: GoGo-Infra/.github/actions/tf-setup (stage write) → terraform-apply-dev.yml
    purpose: Applies Cloudflare changes — buckets, CORS, custom domains, Workers, DNS, Access.
    scope: >-
      Account edit across R2, Workers, DNS and Access, plus Zone edit. This is the one
      credential in the tree that legitimately administers buckets; that is why nothing else
      needs to. Confirm with scripts/ops/check-cf-token-scopes.sh dev.
    provision: Cloudflare dashboard → Manage Account API Tokens, edit permissions.
    description: Loaded only by the apply job, which runs on develop and never on a pull request.

  - path: terraform/read/r2-state-access-key-id
    namespace: ci
    consumer: pipeline
    type: SecureString
    required: []
    provider: cloudflare
    credential_class: s3_key_pair
    used_by: GoGo-Infra/.github/actions/tf-setup (stage read)
    purpose: S3 backend credential so `terraform plan` can read remote state.
    scope: >-
      Object Read on `gogo-terraform-state` only. Verified 10/09/2026: 403 on both
      gogo-dev-assets and gogo-dev-public. An S3 key pair, not a Bearer token — it signs
      SigV4 and cannot call the Cloudflare API.
    pair_with: terraform/read/r2-state-secret-access-key
    provision: Cloudflare → R2 → Manage R2 API Tokens → scoped to the state bucket, read only.
    description: Loaded into a named AWS profile (`r2-state`), never into AWS_ACCESS_KEY_ID.

  - path: terraform/read/r2-state-secret-access-key
    namespace: ci
    consumer: pipeline
    type: SecureString
    required: []
    provider: cloudflare
    credential_class: s3_key_pair
    used_by: GoGo-Infra/.github/actions/tf-setup (stage read)
    purpose: Secret half of the read-stage state credential.
    scope: Object Read on the state bucket only.
    pair_with: terraform/read/r2-state-access-key-id
    provision: Shown once when the R2 API token is created.
    description: Written to the r2-state profile, never exported as an env var.

  - path: terraform/write/r2-state-access-key-id
    namespace: ci
    consumer: pipeline
    type: SecureString
    required: []
    provider: cloudflare
    credential_class: s3_key_pair
    used_by: GoGo-Infra/.github/actions/tf-setup (stage write)
    purpose: S3 backend credential so `terraform apply` can read and write remote state.
    scope: >-
      Object Read & Write on `gogo-terraform-state` only, including the lock object.
      Verified 10/09/2026: 403 on both application buckets.
    pair_with: terraform/write/r2-state-secret-access-key
    provision: Cloudflare → R2 → Manage R2 API Tokens → scoped to the state bucket, read and write.
    description: Loaded into the r2-state profile for the apply job only.

  - path: terraform/write/r2-state-secret-access-key
    namespace: ci
    consumer: pipeline
    type: SecureString
    required: []
    provider: cloudflare
    credential_class: s3_key_pair
    used_by: GoGo-Infra/.github/actions/tf-setup (stage write)
    purpose: Secret half of the write-stage state credential.
    scope: Object Read & Write on the state bucket only.
    pair_with: terraform/write/r2-state-access-key-id
    provision: Shown once when the R2 API token is created.
    description: Written to the r2-state profile, never exported as an env var.

  # GoGo-MobileApp#340, GoGo-Infra#222, ADR-0011 D-5 phase 2. Uploads the app's
  # JavaScript source maps (Hermes) and iOS dSYMs to gogo-mobile, so release
  # crashes read as source file and line instead of minified columns and
  # `<unknown>` frames.
  #
  # There is no mobile CI or Fastlane job yet: release builds run on the owner's
  # workstation. So the reader is the operator session, through
  # `scripts/secrets/exec-with.sh`, which hands the value to the build's child
  # process environment and nowhere else. No dev IAM role is created for it —
  # terraform/environments/dev/main.tf gives a mobile build job its own role
  # when that job exists. Prod Terraform already grants this path to the
  # `mobile-release` OIDC role (terraform/environments/prod/main.tf).
  #
  # Never `.env*`, never `sentry.properties`, never `.env.sentry-build-plugin`:
  # each of those is a file the next build, commit or archive picks up.
  - path: sentry/mobile-auth-token
    namespace: ci
    env_var: SENTRY_AUTH_TOKEN
    consumer: pipeline
    type: SecureString
    required: []
    provider: sentry
    credential_class: api_token
    used_by: >-
      GoGo-MobileApp/scripts/release-build.sh, run through scripts/secrets/exec-with.sh on the
      owner's workstation (dev); prod — the mobile-release OIDC role once a release job exists.
    purpose: >-
      sentry-cli uploads source maps and dSYMs for gogo-mobile during a Release build, and
      creates the release they belong to.
    scope: >-
      Sentry organization auth token. Its scope is fixed by Sentry — Source Map Upload,
      Release Creation, Code Mappings (org:ci) — and is organization-wide: it can upload to
      any project in gogo-vn but cannot read events, issues or stats. One token per
      environment (owner decision 2026-10-15); the split limits revocation, not privilege.
    provision: >-
      Sentry → Settings → Auth Tokens → Create New Token, named gogo-mobile-upload-<env>.
      Shown once. Then put.sh <env> sentry/mobile-auth-token, value on stdin.
    description: >-
      Exported as SENTRY_AUTH_TOKEN to the release build's process only. Absent: the wrapper
      sets SENTRY_DISABLE_AUTO_UPLOAD=true and the build ships unsymbolicated, with a warning.

  # GoGo-Infra#241 / ADR-0013. AI Harness credentials, under `ci` for the same
  # reason as sentry/mobile-auth-token: the harness runs on the owner's
  # workstation or in an automation job, never in api/worker/cms, and is handed
  # its key through scripts/secrets/exec-with.sh for one command.
  #
  # Two rows, two bills, never one key for both (ADR-0013 D-7): the OpenRouter
  # key pays for JEV decisions only, the Anthropic key for headless automation
  # only. Interactive Claude Code runs on the Max subscription and must never
  # see ANTHROPIC_API_KEY — `node harness/src/cli.ts billing --mode interactive`
  # checks that. GoGo-BE's own JEV key (GoGo-BE#709) is a separate, runtime row
  # under `backend`: production traffic and the dev agent never share a key or
  # a budget.
  - path: ai-harness/openrouter-api-key
    namespace: ci
    env_var: OPENROUTER_API_KEY
    consumer: pipeline
    type: SecureString
    required: []
    provider: openrouter
    credential_class: api_key
    used_by: >-
      GoGo-Infra/harness/src/cli.ts (JEV_MODE=live, JEV_LIVE_AUTHORIZED=yes,
      JEV_PRIVACY_REVIEWED=yes), run through
      scripts/secrets/exec-with.sh on the owner's workstation (dev).
    purpose: >-
      Authenticates POST https://openrouter.ai/api/alpha/decisions for the harness Decision
      Router (model typesafe/jev-1.14). Decisions only — no chat completions.
    scope: >-
      OpenRouter API key with a credit limit set on the key at creation (target $2/month,
      ADR-0013 D-7). The limit is the provider-side cap; the harness ledger is a second,
      local one. Not verified by any script here.
    provision: >-
      OpenRouter → Keys → Create key, named gogo_ai_harness_<env>, credit limit set. Shown
      once. Then put.sh <env> ai-harness/openrouter-api-key, value on stdin.
    description: >-
      Exported as OPENROUTER_API_KEY to the harness process only. Absent: JEV_MODE=live refuses
      to start and every checkpoint uses the deterministic fallback.

  - path: ai-harness/anthropic-api-key
    namespace: ci
    env_var: ANTHROPIC_API_KEY
    consumer: pipeline
    type: SecureString
    required: []
    provider: anthropic
    credential_class: api_key
    used_by: >-
      Headless Claude automation (issue triage, targeted review) run through
      scripts/secrets/exec-with.sh. No workflow uses it yet.
    purpose: >-
      Anthropic API billing for approved headless tasks, kept apart from the interactive
      Claude Max subscription and from OpenRouter (ADR-0013 D-7).
    scope: >-
      Key in a dedicated Anthropic workspace with a monthly spend limit (target $100 credit,
      $10 operational reserve) and automatic top-up off. A promotional credit is not a hard cap.
    provision: >-
      Anthropic Console → Workspace gogo-automation → API keys → Create key; set the workspace
      spend limit first. Then put.sh <env> ai-harness/anthropic-api-key, value on stdin.
    description: >-
      Exported as ANTHROPIC_API_KEY to one automation command only — never to an interactive
      Claude Code session, never through OpenRouter.


  # GoGo-Infra#250. The agent's own GitHub identity: a GitHub App, so pull
  # requests opened by Claude sessions are authored by `<app>[bot]`, not by the
  # owner. The owner can then approve them, and require_code_owner_reviews can
  # be switched on for develop without locking every agent PR behind an admin
  # bypass. A `[bot]` account is not billed as a Sentry Seer active contributor;
  # a machine user would be.
  #
  # Under `ci` like the other workstation credentials: never rendered into
  # api/worker/cms. scripts/secrets/github-app-token.sh, run through
  # exec-with.sh with all three rows, signs a 10-minute JWT and trades it for a
  # one-hour installation token; the private key never leaves that process.
  - path: github/agent-app-private-key
    namespace: ci
    env_var: GITHUB_APP_PRIVATE_KEY
    consumer: pipeline
    type: SecureString
    required: []
    provider: github
    credential_class: private_key
    used_by: >-
      scripts/secrets/github-app-token.sh, run through scripts/secrets/exec-with.sh on the
      owner's workstation or in an agent session the owner starts.
    purpose: >-
      Signs the JWT that GitHub exchanges for an installation token of the agent App, so the
      agent pushes branches, opens pull requests and comments on issues as `<app>[bot]`.
    scope: >-
      Whatever the App was granted on the repositories it is installed on: Contents,
      Pull requests and Issues read/write; Metadata, Checks and Actions read. No Workflows,
      Administration, Secrets, Environments or Deployments, so the agent cannot change a
      workflow, branch protection or a secret. Each token can be narrowed further with --repo.
    provision: >-
      GitHub → Settings → Developer settings → GitHub Apps → the agent App → Generate a private
      key. The .pem downloads once. Then put.sh dev github/agent-app-private-key < the.pem and
      delete the file.
    rotation: >-
      Generate a second key, store it, mint one token with it, then delete the old key on the
      App page. Deleting every key (or uninstalling the App) is the kill switch.
    description: >-
      The whole .pem file, newlines included (RSA, about 1.7 KB, under the 4 KB Standard tier).
      Absent: github-app-token.sh refuses before any request.

  - path: github/agent-app-id
    namespace: ci
    env_var: GITHUB_APP_ID
    consumer: pipeline
    type: String
    required: []
    provider: github
    credential_class: identifier
    used_by: scripts/secrets/github-app-token.sh (JWT issuer).
    purpose: The numeric App ID of the agent App; not a secret.
    provision: >-
      The App's settings page → About → App ID. Then put.sh dev github/agent-app-id String.
    description: Digits only. Absent or non-numeric, github-app-token.sh refuses.

  - path: github/agent-app-installation-id
    namespace: ci
    env_var: GITHUB_APP_INSTALLATION_ID
    consumer: pipeline
    type: String
    required: []
    provider: github
    credential_class: identifier
    used_by: scripts/secrets/github-app-token.sh (which installation the token is for).
    purpose: The installation of the agent App on the owner's account; not a secret.
    provision: >-
      The number at the end of github.com/settings/installations/<id> after installing the
      App on the selected repositories. Then put.sh dev github/agent-app-installation-id String.
    description: Digits only. Absent or non-numeric, github-app-token.sh refuses.

  # GoGo-Infra#231 (INF-STORE-1) and #271 (INF-STORE-2), paired with the
  # Fastlane lanes in GoGo-MobileApp#350 / #351 (prod → TestFlight / Play) and
  # #391 (dev, staging → Firebase App Distribution). Under `ci` for the same
  # reason as sentry/mobile-auth-token (#222): a `ci` row is never rendered into
  # the runtime env of api, worker or cms — it is handed to one command through
  # scripts/secrets/exec-with.sh and dies with it.
  #
  # Two prefixes, two questions (owner 2026-10-28, shape
  # sa-shape-infra-271-firebase-distribution.fable.md D-2):
  #
  #   signing/  the identity a build is signed with. One SSM set per
  #             environment — /gogo/ci/<env>/signing/… — so the dev, staging and
  #             prod values are different parameters behind one row and one
  #             env_var, and the same lane signs any flavour; the environment
  #             argument picks the set (staging → flavour stag, as mobile-env.py).
  #             Renamed from store/ by #271 before any value existed.
  #   store/    what publishes to a store. prod only: dev and staging go to
  #             Firebase (firebase/* below), never to TestFlight or Play.
  #
  # prod additionally buys the typed confirmation in exec-with.sh on every use,
  # which for the upload key of a shipped app is the right amount of friction.
  # dev and staging have none, by design: those keys sign a tester build and
  # upload it to Firebase, not to a store.
  #
  # `required: []` everywhere until the owner has written the values
  # (validate.sh reports a required row absent from SSM as MISSING); the
  # environments each set serves are stated by the capabilities that require it
  # (store_release_* planned prod, firebase_distribution_* planned dev, staging).
  # Flip `required` per environment once validate.sh <env> is green.
  #
  # iOS certificate and provisioning profiles are not rows: the lane creates and
  # fetches them with fastlane cert/sigh through the App Store Connect key
  # (no `match`, owner 2026-10-28). An Ad Hoc profile grows with every UDID and
  # outgrows a 4 KB Standard parameter; the certificate's private key stays in
  # the owner's login keychain. Apple has one "Apple Distribution" certificate
  # type for App Store and Ad Hoc alike, so one certificate serves every
  # environment — the per-environment split is the key and the profile.
  #
  # Not a row: the Apple team id. An App Store Connect API key authenticates on
  # its own (issuer + key id + the .p8), and fastlane reads the team from it —
  # a team id row would be a value nothing uses.

  - path: signing/apple-asc-key
    namespace: ci
    env_var: ASC_KEY_CONTENT
    consumer: pipeline
    type: SecureString
    required: []
    provider: apple
    credential_class: private_key
    used_by: >-
      GoGo-MobileApp/fastlane iOS lanes — prod (#350, TestFlight), dev and staging (#391, Firebase
      App Distribution) — run through scripts/secrets/exec-with.sh on the owner's workstation.
    purpose: >-
      App Store Connect API key — authenticates the build's certificate and provisioning work
      (cert/sigh) and, in prod, the TestFlight upload, without an Apple ID password or a session
      cookie.
    scope: >-
      One Team key per environment (owner decisions 2026-10-15 Q3 and 2026-10-28). prod: role
      App Manager. dev, staging: the role that may create certificates and Ad Hoc profiles
      (Admin per fastlane and secondary sources; confirm on Apple's roles page at creation and
      take App Manager if it suffices). ASC keys scope by role, not by app, so the split limits
      revocation, not privilege. Revoking it in App Store Connect → Users and Access →
      Integrations is the kill switch; it reaches no other Apple service.
    rotation: >-
      The .p8 downloads once, at creation. Then put.sh <env> signing/apple-asc-key, value on
      stdin. To rotate: create the new key, store it, build once with it, then revoke the old.
    description: >-
      The whole .p8 file, newlines included. Absent: the iOS lane refuses before building
      rather than falling back to an interactive Apple login.

  - path: signing/apple-asc-key-id
    namespace: ci
    env_var: ASC_KEY_ID
    consumer: pipeline
    type: String
    required: []
    provider: apple
    credential_class: identifier
    used_by: GoGo-MobileApp/fastlane iOS lanes (#350 prod, #391 dev/staging)
    purpose: Names which App Store Connect key the .p8 belongs to.
    scope: Not a secret on its own; useless without the .p8, and stored beside it so the pair cannot drift.
    rotation: Replaced together with signing/apple-asc-key.
    description: The key id shown next to the key in App Store Connect (10 characters).

  - path: signing/apple-asc-issuer-id
    namespace: ci
    env_var: ASC_ISSUER_ID
    consumer: pipeline
    type: String
    required: []
    provider: apple
    credential_class: identifier
    used_by: GoGo-MobileApp/fastlane iOS lanes (#350 prod, #391 dev/staging)
    purpose: Names the App Store Connect account the key authenticates against.
    scope: Not a secret on its own; one value per Apple account, shown above the key list.
    rotation: Changes only if the Apple account changes.
    description: Issuer id (a UUID) from App Store Connect → Users and Access → Integrations.

  - path: signing/android-keystore
    namespace: ci
    env_var: ANDROID_KEYSTORE_BASE64
    consumer: pipeline
    type: SecureString
    required: []
    provider: self
    credential_class: signing_key
    used_by: >-
      GoGo-MobileApp/fastlane Android lanes — prod (#351, Play), dev and staging (#391, Firebase
      App Distribution) — run through scripts/secrets/exec-with.sh on the owner's workstation.
    purpose: >-
      dev, staging: the keystore the tester build is signed with, and the signature installed
      copies verify — nothing re-signs a Firebase build. Losing it means testers uninstall before
      the next install, and its SHA-1 (Maps) and SHA-256 (dev assetlinks.json) change. One
      keystore per environment, never the prod one and never the debug keystore (owner
      2026-10-28). prod: the **upload** keystore the AAB is signed with. Play App Signing (mandatory for apps created
      since August 2021) re-signs every release with the app signing key Google holds, so this key
      authenticates uploads rather than being the signature installed copies verify.
    scope: >-
      dev, staging: one keystore per environment, alias gogo-<env>, signs nothing else. prod: one
      upload keystore for the shipped Android app, distinct from the app signing key Google
      generates and holds (a new app cannot decline Play App Signing). Losing it is a Play Console
      upload-key reset, not the end of updates — but the reset is support-mediated, so keep a backup.
      If the owner imports an existing app signing key at enrolment instead, Google still holds and
      signs with it: this row stays a separate upload key and loss is still a reset, but compromise
      of the imported key is the worse case. Only a pre-August-2021 app that never enrolled has its
      keystore as the app signing key; not GoGo's. Record the arrangement on GoGo-Infra#231 when the
      Play account exists (GoGo-MobileApp#21).
    rotation: >-
      prod: generate a new keystore, request an upload key reset in Play Console, re-upload this row
      and its passwords. dev, staging: a new keystore is a new signature — re-register its SHA-1 on
      google/maps-android-api-key (and its SHA-256 in config/well-known/dev for dev) and have
      testers reinstall. PKCS12 (keytool's default since JDK 9) carries one password for store and key,
      so both password rows hold the same value. base64 the keystore, then
      put.sh <env> signing/android-keystore with the base64 on stdin — RSA-2048, because base64 of a
      4096-bit keystore does not fit a Standard-tier parameter.
    description: >-
      base64 of the PKCS12 file (base64 because SSM holds text and a keystore is binary).
      Absent: the Android lane refuses before building rather than producing an unsigned or
      debug-signed artifact.

  - path: signing/android-keystore-password
    namespace: ci
    env_var: ANDROID_KEYSTORE_PASSWORD
    consumer: pipeline
    type: SecureString
    required: []
    provider: self
    credential_class: password
    used_by: GoGo-MobileApp/fastlane Android lanes (#351 prod, #391 dev/staging)
    purpose: Opens the keystore file.
    scope: >-
      Useless without signing/android-keystore; stored separately so a leaked keystore file is not
      also an unlocked one. On PKCS12 it is the key password as well, so this row alone unlocks
      both layers once paired with the file.
    rotation: >-
      keytool -storepasswd; the keystore row must be re-uploaded afterwards because the file changes,
      and on PKCS12 signing/android-key-password holds the same value.
    description: Store password of the keystore above.

  - path: signing/android-key-alias
    namespace: ci
    env_var: ANDROID_KEY_ALIAS
    consumer: pipeline
    type: String
    required: []
    provider: self
    credential_class: identifier
    used_by: GoGo-MobileApp/fastlane Android lanes (#351 prod, #391 dev/staging)
    purpose: Names which key inside the keystore signs the release.
    scope: Not a secret; wrong value fails the build rather than signing with something else.
    rotation: Fixed for the life of the keystore.
    description: Alias of the release key inside the PKCS12 keystore (.p12).

  - path: signing/android-key-password
    namespace: ci
    env_var: ANDROID_KEY_PASSWORD
    consumer: pipeline
    type: SecureString
    required: []
    provider: self
    credential_class: password
    used_by: GoGo-MobileApp/fastlane Android lanes (#351 prod, #391 dev/staging)
    purpose: Opens the release key inside the keystore.
    scope: >-
      Useless without the keystore file. On PKCS12 it is the same value as
      signing/android-keystore-password, so either password row unlocks both the store and the key
      once paired with the file — the split protects the file from its password, not one layer
      from the other.
    rotation: >-
      PKCS12 has a single password, so this moves with signing/android-keystore-password; both rows are
      re-uploaded together, along with the keystore row itself.
    description: >-
      Key password for the alias above. On a PKCS12 keystore this is the store password: keytool
      warns and ignores a different -keypass rather than refusing, so whatever was typed, the key
      opens with the store password — store that value here. The row exists because fastlane reads
      both names, and because a JKS keystore could carry two.

  - path: store/play-service-account
    namespace: ci
    env_var: PLAY_SERVICE_ACCOUNT_JSON
    consumer: pipeline
    type: SecureString
    required: []
    provider: google
    credential_class: service_account
    used_by: GoGo-MobileApp/fastlane Android lane (#351)
    purpose: >-
      Uploads the signed AAB to the Play internal track through the Play Developer API.
    scope: >-
      One service account, granted on the GoGo app only, with release-management rights and
      nothing else — it is not the Google Cloud service account any backend uses, and it holds
      no Maps or Sheets access.
    rotation: >-
      Create a new key for the same service account, store it, upload once, then delete the old
      key in Google Cloud IAM. put.sh prod store/play-service-account, JSON on stdin.
    description: >-
      The service-account JSON key file, verbatim. The upload step is the only thing that reads it,
      so an Android lane invoked without this row (four signing rows only) signs and stops — but
      naming it while it has no value stops exec-with.sh before the build, because the wrapper is
      all-or-nothing. Either way nothing is published under another identity.

  # GoGo-Infra#271 (INF-STORE-2), paired with GoGo-MobileApp#391. dev and staging
  # builds reach testers through Firebase App Distribution (owner 2026-10-28):
  # one Firebase project per environment (gogo-dev, gogo-stag), each with one iOS
  # and one Android app at the flavour's id (max.gogo.dev / max.gogo.stag). Same
  # `ci` rule as the signing rows above. No prod row: prod goes to the stores.
  #
  # Not rows: tester groups (lane arguments, not secrets), UDIDs (the Apple
  # Developer → Devices list is the registry), and FIREBASE_TOKEN — the Firebase
  # CLI login token is deprecated and would authenticate as the owner's Google
  # account rather than as one scoped service account.
  - path: firebase/app-distribution-service-account
    namespace: ci
    env_var: FIREBASE_SERVICE_CREDENTIALS_JSON
    consumer: pipeline
    type: SecureString
    required: []
    provider: google
    credential_class: service_account
    used_by: >-
      GoGo-MobileApp/fastlane Firebase lanes (#391), dev and staging, run through
      scripts/secrets/exec-with.sh on the owner's workstation.
    purpose: >-
      Uploads the signed IPA / APK to Firebase App Distribution and hands it to the tester
      groups the lane names.
    scope: >-
      One service account per Firebase project, created in that project (a Firebase project is a
      Google Cloud project) with role Firebase App Distribution Admin and nothing else — never in
      the project that owns the Maps keys, never the Play service account. Deleting its key in
      Google Cloud IAM is the kill switch. The role is full read/write on that project's App
      Distribution — upload releases, add and remove testers and groups, read tester emails
      (personal data) — and reaches no other Firebase or Google Cloud service and no other project.
    rotation: >-
      Create a new key for the same service account, put.sh <env>
      firebase/app-distribution-service-account with the JSON on stdin, distribute once, then
      delete the old key in Google Cloud IAM.
    description: >-
      The service-account JSON key, verbatim (~2.3 KB, fits a Standard parameter). Handed to the
      lane as content, never as a path: the lane passes it to the plugin without writing it to a
      file that outlives the build. Absent: the lane refuses before building.

  - path: firebase/app-id-ios
    namespace: ci
    env_var: FIREBASE_APP_ID_IOS
    consumer: pipeline
    type: String
    required: []
    provider: google
    credential_class: identifier
    used_by: GoGo-MobileApp/fastlane Firebase iOS lane (#391)
    purpose: Names the Firebase iOS app (max.gogo.dev / max.gogo.stag) the IPA is distributed to.
    scope: >-
      Not a secret; useless without the service account, and stored beside it so the project and
      the app cannot drift apart.
    rotation: Fixed for the life of the Firebase app.
    description: >-
      Firebase app id, 1:<project number>:ios:<hash>, from Project settings → Your apps.

  - path: firebase/app-id-android
    namespace: ci
    env_var: FIREBASE_APP_ID_ANDROID
    consumer: pipeline
    type: String
    required: []
    provider: google
    credential_class: identifier
    used_by: GoGo-MobileApp/fastlane Firebase Android lane (#391)
    purpose: Names the Firebase Android app (max.gogo.dev / max.gogo.stag) the APK is distributed to.
    scope: >-
      Not a secret; useless without the service account, and stored beside it so the project and
      the app cannot drift apart.
    rotation: Fixed for the life of the Firebase app.
    description: >-
      Firebase app id, 1:<project number>:android:<hash>, from Project settings → Your apps.


# ── capabilities ──────────────────────────────────────────────────────────────
#
# INF-171. A capability is a group of credentials that only works if all of them
# are present, plus the environments it runs in. Two kinds, same shape:
#
#   feature   the application does something extra when its credentials exist
#   pipeline  a CI workflow can run at all when its credentials exist
#
# This block exists because `required:` cannot express either one.
# `required: [dev, staging, prod]` says "the API will not boot without this",
# which is false for every row here. `required: []` says "nothing breaks", which
# is the sentence that let eleven pipeline credentials sit undeclared and let the
# public-bucket trio spend a fortnight half-provisioned while the API booted
# happily and every catalogue image 404'd.
#
# `enabled:` is where the capability runs today. `planned:` is where it is
# intended to run and has not been provisioned yet. Both are enforced by a
# readiness check — `--strict` covers `enabled`, `--strict --include-planned`
# covers both — so bringing up staging is:
#
#   validate.sh staging --strict --include-planned
#
# and the output is the list of credentials to create. No row in `parameters:`
# needs editing when an environment arrives, and nobody has to remember which
# `required:` lists to touch. That memory step was the original problem.
#
# `requires:` entries are `namespace:path`, defaulting to `backend`. The
# namespace matters: `cms-deploy/cloudflare-token` and `r2/public-bucket` live in
# different SSM trees under different IAM.
#
# An environment that appears in no capability at all cannot be reported ready.
# A readiness check that passes because nothing was declared is the same failure
# as one that passes because a namespace could not be read.

capabilities:
  - name: public_catalogue_uploads
    kind: feature
    enabled: [dev]
    planned: [staging, prod]
    description: >-
      ADR-0005 — place photos, banners and campaign images are uploaded straight to the
      public bucket and served from the assets host. Without all four the API still boots and
      every catalogue image resolves to a URL that 404s, which is how this shipped broken.
    requires: [backend:r2/public-bucket, backend:r2/public-access-key-id, backend:r2/public-secret-access-key, backend:media/public-base-url]

  - name: avatar_cache_purge
    kind: feature
    enabled: [dev]
    planned: [staging, prod]
    description: >-
      ADR-0022 — a removed avatar is purged at the edge instead of answering for its cache
      lifetime. Without both, deletion succeeds and the old picture keeps being served.
    requires: [backend:cloudflare/zone-id, backend:cloudflare/cache-purge-token]

  - name: share_link_edge
    kind: feature
    enabled: [dev]
    planned: [staging, prod]
    description: >-
      LNK-* — the share-link Worker authenticates to the API with a shared token. Without it
      the Worker is deployed and every /l/<slug> answers 502.
    requires: [backend:share-link/base-url, backend:share-link/worker-auth-token]

  - name: secure_export
    kind: feature
    enabled: [dev]
    planned: [staging, prod]
    description: >-
      GoGo-BE#256 / ADR-0033 — a personal-data export is delivered as an encrypted artifact the
      signed-in account owner downloads once. Without the wrapping key the API boots and every
      export request answers 503 EXPORT_UNAVAILABLE.
    requires: [backend:privacy-export/wrapping-key-v1, backend:r2/bucket, backend:r2/access-key-id, backend:r2/secret-access-key]

  # Pipelines. Each names the credentials its workflow reads, so a new
  # environment's CI can be provisioned from the readiness output rather than by
  # reading the workflows again.
  - name: terraform
    kind: pipeline
    enabled: [dev]
    planned: [staging, prod]
    description: >-
      terraform-plan-<env>.yml and terraform-apply-<env>.yml. The read/write split is a
      privilege boundary: plan runs on pull requests, apply only on the default branch.
      Six credentials, and a missing one fails the job rather than the environment.
    requires: [ci:terraform/read/cloudflare-token, ci:terraform/read/r2-state-access-key-id, ci:terraform/read/r2-state-secret-access-key, ci:terraform/write/cloudflare-token, ci:terraform/write/r2-state-access-key-id, ci:terraform/write/r2-state-secret-access-key]

  - name: cms_deploy
    kind: pipeline
    enabled: [dev]
    planned: [staging, prod]
    description: >-
      deploy-cms-<env>.yml — builds GoGo-CMS and uploads the Worker. The Cloudflare token
      needs Workers only; it holds no R2, and the checkout token is a separate credential
      because a deploy token that can read source is two permissions, not one.
    requires: [ci:cms-deploy/cloudflare-token, ci:cms-deploy/github-read-token]

  - name: vps_deploy
    kind: pipeline
    enabled: [dev]
    planned: [staging, prod]
    description: >-
      deploy-<env>.yml — ships GoGo-BE to the host over the Cloudflare Access tunnel. The SSH
      key alone does not reach the host: the Access service token pair is what gets through
      the policy in front of it.
    requires: [ci:deploy/ssh-private-key, ci:deploy/access-client-id, ci:deploy/access-client-secret]

  - name: sentry_mobile_uploads
    kind: feature
    enabled: [dev]
    planned: [staging, prod]
    description: >-
      GoGo-MobileApp release build (scripts/release-build.sh) uploads source maps and dSYMs
      to Sentry gogo-mobile (ADR-0011 D-5 phase 2). A feature, not a pipeline: no CI workflow
      runs it yet (the build is on a workstation), and without the token the release still
      ships, unsymbolicated — which is why readiness has to say it is missing.
    requires: [ci:sentry/mobile-auth-token]

  - name: ai_harness_live_decisions
    kind: feature
    enabled: []
    planned: [dev]
    description: >-
      GoGo-Infra#241 / ADR-0013 — the harness Decision Router asks JEV through OpenRouter. A
      feature, not a pipeline: it runs on a workstation through exec-with.sh. Off until the
      owner authorizes paid inference; without the key every checkpoint uses its deterministic
      fallback, which is why readiness has to say it is missing.
    requires: [ci:ai-harness/openrouter-api-key]

  - name: ai_assistant
    kind: feature
    enabled: []
    planned: [dev]
    description: >-
      GoGo-Infra#257 / ADR-0014 — the in-app GoGo AI assistant (GoGo-BE#713) answers through
      its own OpenRouter key with a model and both limits set. Without any one of them the API
      boots and the assistant answers unavailable, which is why readiness has to say so.
      flags/assistant and the fallback model are not listed: absent, each has a safe meaning.
    requires: [backend:openrouter/assistant-api-key, backend:assistant/model, backend:budget/assistant-monthly-max-usd, backend:budget/assistant-user-daily-max-messages]

  - name: store_release_ios
    kind: feature
    enabled: []
    planned: [prod]
    description: >-
      GoGo-Infra#231 / GoGo-MobileApp#350 — the fastlane iOS lane signs a Release build and
      uploads it to TestFlight. A feature, not a pipeline: no CI workflow runs it (the lane is
      on the owner's workstation). All three are needed together; with any one missing the lane
      refuses before building, which is the behaviour readiness has to be able to report.
    requires: [ci:signing/apple-asc-key, ci:signing/apple-asc-key-id, ci:signing/apple-asc-issuer-id]

  - name: store_release_android
    kind: feature
    enabled: []
    planned: [prod]
    description: >-
      GoGo-Infra#231 / GoGo-MobileApp#351 — the fastlane Android lane signs the AAB and uploads
      it to the Play internal track. The keystore trio signs; the service account publishes. All
      five together are what the documented upload invocation needs: exec-with.sh refuses before
      the build if one of the rows it is given is missing, so "sign but do not upload" is a lane
      invoked with the four signing rows, not this capability half-met.
    requires: [ci:signing/android-keystore, ci:signing/android-keystore-password, ci:signing/android-key-alias, ci:signing/android-key-password, ci:store/play-service-account]

  - name: firebase_distribution_ios
    kind: feature
    enabled: []
    planned: [dev, staging]
    description: >-
      GoGo-Infra#271 / GoGo-MobileApp#391 — the fastlane iOS lane signs an Ad Hoc build (cert and
      profile via the App Store Connect key) and distributes it through Firebase App Distribution.
      Not prod: prod is store_release_ios. All five together; with any one missing exec-with.sh
      refuses before the build.
    requires: [ci:signing/apple-asc-key, ci:signing/apple-asc-key-id, ci:signing/apple-asc-issuer-id, ci:firebase/app-distribution-service-account, ci:firebase/app-id-ios]

  - name: firebase_distribution_android
    kind: feature
    enabled: []
    planned: [dev, staging]
    description: >-
      GoGo-Infra#271 / GoGo-MobileApp#391 — the fastlane Android lane signs the APK with this
      environment's keystore and distributes it through Firebase App Distribution. Not prod: prod
      is store_release_android.
    requires: [ci:signing/android-keystore, ci:signing/android-keystore-password, ci:signing/android-key-alias, ci:signing/android-key-password, ci:firebase/app-distribution-service-account, ci:firebase/app-id-android]
